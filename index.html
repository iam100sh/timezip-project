<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>timezip</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --line: #e3e3e0;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --surface: #202020;
        --text: #f0f0f0;
        --muted: #a0a0a0;
        --line: #333333;
        --accent: #6f9bff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
    }
    h1 { font-size: 1.5rem; letter-spacing: -0.03em; flex-shrink: 0; }
    h1 span { color: var(--accent); }

    /* 검색창 */
    #search-form { display: flex; gap: 6px; flex: 1; max-width: 480px; }
    #keyword {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }
    #search-form button {
      padding: 8px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    /* 지도 + 검색 결과 목록 */
    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }
    #results {
      width: 320px;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      list-style: none;
    }
    #results:empty { display: none; }
    #results li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    #results li:hover { background: var(--bg); }
    #results .name { font-weight: 600; }
    #results .addr, #results .phone { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    #results .message { color: var(--muted); cursor: default; }

    /* 휴대폰: 목록을 지도 아래로 */
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #results { width: 100%; max-height: 40%; border-left: none; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>time<span>zip</span></h1>
    <form id="search-form">
      <input id="keyword" type="search" placeholder="장소나 주소 검색 (예: 석계역 카페)" value="석계역 카페">
      <button type="submit">검색</button>
    </form>
  </header>

  <main>
    <div id="map"></div>
    <ul id="results"></ul>
  </main>

  <!-- Javascript API 불러오기 + services 라이브러리 (&libraries=services) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=28e326bf94524ee99ed587b9b4d00150&libraries=services"></script>

  <script>
    // 지도 만들기 (석계역 중심)
    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.614829, 127.065526),
      level: 3
    });

    // services 라이브러리의 두 가지 기능
    var places = new kakao.maps.services.Places();     // 장소 검색 (키워드 → 장소 목록)
    var geocoder = new kakao.maps.services.Geocoder(); // 주소-좌표 변환 (주소 → 좌표)

    var infowindow = new kakao.maps.InfoWindow({ zIndex: 1 }); // 마커를 누르면 뜨는 말풍선
    var markers = [];
    var resultList = document.getElementById('results');

    // 검색 버튼을 누르면 실행
    document.getElementById('search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var keyword = document.getElementById('keyword').value.trim();
      if (!keyword) return;
      search(keyword);
    });

    function search(keyword) {
      // 1) 먼저 장소 검색을 해 봐요 (예: "석계역 카페")
      places.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          showPlaces(data);
          return;
        }
        // 2) 장소가 없으면 주소로 좌표를 찾아봐요 (예: "서울 노원구 월계동 1")
        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            showPlaces(result.map(function (r) {
              return { place_name: r.address_name, road_address_name: r.road_address ? r.road_address.address_name : '', x: r.x, y: r.y };
            }));
          } else {
            clearMarkers();
            showMessage('검색 결과가 없어요. 다른 검색어로 해 보세요.');
          }
        });
      });
    }

    // 검색 결과를 지도에 마커로, 옆에 목록으로 보여주기
    function showPlaces(list) {
      clearMarkers();
      resultList.innerHTML = '';
      var bounds = new kakao.maps.LatLngBounds(); // 모든 마커가 보이게 지도 범위 맞추기

      list.forEach(function (place) {
        var position = new kakao.maps.LatLng(place.y, place.x);
        var marker = new kakao.maps.Marker({ map: map, position: position });
        bounds.extend(position);

        var item = document.createElement('li');
        addLine(item, 'name', place.place_name);
        addLine(item, 'addr', place.road_address_name || place.address_name);
        addLine(item, 'phone', place.phone);
        resultList.appendChild(item);

        function focus() {
          map.panTo(position);
          var box = document.createElement('div');
          box.style.cssText = 'padding:6px 10px;font-size:13px;color:#1f1f1f;white-space:nowrap;';
          box.textContent = place.place_name;
          infowindow.setContent(box);
          infowindow.open(map, marker);
        }
        kakao.maps.event.addListener(marker, 'click', focus);
        item.addEventListener('click', focus);
        markers.push({ marker: marker, focus: focus });
      });

      map.setBounds(bounds);
    }

    function addLine(parent, className, text) {
      if (!text) return;
      var div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      parent.appendChild(div);
    }

    function showMessage(text) {
      resultList.innerHTML = '';
      var item = document.createElement('li');
      item.className = 'message';
      item.textContent = text;
      resultList.appendChild(item);
    }

    function clearMarkers() {
      markers.forEach(function (m) { m.marker.setMap(null); });
      markers = [];
      clickMarker.setMap(null);
      infowindow.close();
    }

    // 지도를 클릭하면 그 자리의 주소 알려주기 (좌표 → 주소)
    var clickMarker = new kakao.maps.Marker(); // 클릭한 자리에 찍을 마커

    kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
      var latlng = mouseEvent.latLng; // 클릭한 자리의 좌표

      // 가게 마커를 누른 거면 주소 대신 가게 이름을 보여줘요
      // (휴대폰에서는 마커를 눌러도 지도 클릭이 같이 일어날 수 있어서 직접 확인해요)
      var hit = findMarkerAt(latlng);
      if (hit) {
        hit.focus();
        return;
      }

      var thisClick = ++clickCount; // 빠르게 여러 번 누르면 마지막 클릭 결과만 보여줘요

      // 주소 찾기와 근처 가게 찾기를 동시에 하고, 둘 다 끝나면 말풍선에 보여줘요
      Promise.all([getAddress(latlng), findNearbyPlaces(latlng)]).then(function (answers) {
        if (thisClick !== clickCount) return;
        var address = answers[0];
        var nearby = answers[1];
        if (!address && nearby.length === 0) return;

        var box = document.createElement('div');
        box.style.cssText = 'padding:8px 10px;font-size:13px;color:#1f1f1f;line-height:1.5;white-space:nowrap;';

        if (nearby.length > 0) {
          var title = document.createElement('div');
          title.style.cssText = 'font-weight:600;font-size:14px;';
          title.textContent = nearby[0].place_name;
          box.appendChild(title);
          var others = nearby.slice(1).map(function (p) { return p.place_name + ' ' + p.distance + 'm'; });
          if (others.length > 0) {
            var more = document.createElement('div');
            more.style.cssText = 'color:#6b6b6b;margin-bottom:4px;';
            more.textContent = '근처: ' + others.join(', ');
            box.appendChild(more);
          }
        }
        if (address) {
          if (address.road_address) addLine(box, 'road', '도로명: ' + address.road_address.address_name);
          addLine(box, 'jibun', '지번: ' + address.address.address_name);
        }

        clickMarker.setPosition(latlng);
        clickMarker.setMap(map);
        infowindow.setContent(box);
        infowindow.open(map, clickMarker);
      });
    });

    var clickCount = 0;

    // 좌표 → 주소 (coord2Address는 (경도, 위도) 순서예요)
    function getAddress(latlng) {
      return new Promise(function (resolve) {
        geocoder.coord2Address(latlng.getLng(), latlng.getLat(), function (result, status) {
          resolve(status === kakao.maps.services.Status.OK ? result[0] : null);
        });
      });
    }

    // 클릭한 자리 주변(30m)의 가게 찾기
    // 지도에 그려진 주황색 아이콘은 코드로 알 수 없어서, 카테고리별로 주변 장소를 검색해 가장 가까운 곳을 골라요
    var CATEGORIES = [
      'MT1', 'CS2', 'PS3', 'SC4', 'AC5', 'PK6', 'OL7', 'SW8', 'BK9', // 마트 편의점 어린이집 학교 학원 주차장 주유소 지하철역 은행
      'CT1', 'AG2', 'PO3', 'AT4', 'AD5', 'FD6', 'CE7', 'HP8', 'PM9'  // 문화시설 중개업소 공공기관 관광명소 숙박 음식점 카페 병원 약국
    ];
    var NEARBY_RADIUS = 30; // 미터

    function findNearbyPlaces(latlng) {
      var searches = CATEGORIES.map(function (code) {
        return new Promise(function (resolve) {
          places.categorySearch(code, function (data, status) {
            resolve(status === kakao.maps.services.Status.OK ? data : []);
          }, { location: latlng, radius: NEARBY_RADIUS, sort: kakao.maps.services.SortBy.DISTANCE });
        });
      });
      return Promise.all(searches).then(function (lists) {
        var all = [].concat.apply([], lists);
        all.sort(function (a, b) { return Number(a.distance) - Number(b.distance); });
        return all.slice(0, 3); // 가장 가까운 3곳
      });
    }

    // 클릭한 자리가 가게 마커 그림 위인지 확인 (화면 픽셀 거리로 비교)
    function findMarkerAt(latlng) {
      var projection = map.getProjection();
      var click = projection.containerPointFromCoords(latlng);
      for (var i = 0; i < markers.length; i++) {
        var point = projection.containerPointFromCoords(markers[i].marker.getPosition());
        var dx = click.x - point.x;
        var dy = click.y - point.y; // 마커 그림은 좌표보다 위쪽에 그려져요
        if (Math.abs(dx) <= 16 && dy >= -40 && dy <= 6) return markers[i];
      }
      return null;
    }
  </script>
</body>
</html>
