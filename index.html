<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>timezip</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1f1f1f;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --text: #f0f0f0;
        --accent: #6f9bff;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header { padding: 12px 16px; }
    h1 { font-size: 1.5rem; letter-spacing: -0.03em; }
    h1 span { color: var(--accent); }
    /* 1단계: 지도를 담을 영역 (화면 크기에 맞춰 꽉 채움) */
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>time<span>zip</span></h1>
  </header>

  <!-- 1단계: 지도를 담을 영역 만들기 -->
  <div id="map"></div>

  <!-- 2단계: 실제 지도를 그리는 Javascript API 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=28e326bf94524ee99ed587b9b4d00150"></script>

  <!-- 3단계: 지도를 띄우는 코드 작성 -->
  <script>
    var container = document.getElementById('map'); // 지도를 담을 영역
    var options = {
      center: new kakao.maps.LatLng(37.614829, 127.065526), // 지도의 중심좌표 (석계역)
      level: 3 // 지도의 확대 레벨 (숫자가 작을수록 확대)
    };

    var map = new kakao.maps.Map(container, options); // 지도 생성
  </script>
</body>
</html>
