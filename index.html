<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>timezip</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --line: #e3e3e0;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --surface: #202020;
        --text: #f0f0f0;
        --muted: #a0a0a0;
        --line: #333333;
        --accent: #6f9bff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
    }
    h1 { font-size: 1.5rem; letter-spacing: -0.03em; flex-shrink: 0; }
    h1 span { color: var(--accent); }

    /* 검색창 */
    #search-form { display: flex; gap: 6px; flex: 1; max-width: 480px; }
    #keyword {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }
    #search-form button {
      padding: 8px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    /* 지도 + 검색 결과 목록 */
    main { flex: 1; display: flex; min-height: 0; }
    #map-wrap { flex: 1; position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; }

    /* 내 위치 버튼 (지도 오른쪽 아래) */
    #my-location {
      position: absolute; right: 12px; bottom: 28px; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--surface); color: var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #my-location.loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 주변 정류장 버튼 (내 위치 버튼 위) */
    #bus-toggle {
      position: absolute; right: 12px; bottom: 82px; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--surface); color: var(--muted);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #bus-toggle.on { background: #0068b7; color: #fff; border-color: #0068b7; }
    /* 카페, 음식점, 편의점 버튼 줄 (지도 위쪽) */
    #category-chips {
      position: absolute; left: 0; right: 0; top: 10px; z-index: 2;
      display: flex; gap: 6px; padding: 0 12px; overflow-x: auto; scrollbar-width: none;
      pointer-events: none; /* 버튼 사이 빈 곳은 지도를 그대로 누를 수 있게 */
    }
    #category-chips::-webkit-scrollbar { display: none; }
    #category-chips button {
      pointer-events: auto; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
      padding: 7px 12px; border-radius: 18px; font-size: 14px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); cursor: pointer;
    }
    #category-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    #bus-hint {
      position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 2;
      padding: 6px 12px; border-radius: 16px; font-size: 13px;
      background: rgba(0, 0, 0, 0.7); color: #fff; white-space: nowrap;
    }
    #bus-hint[hidden] { display: none; }

    /* 지도 위 정류장 표시 */
    .bus-stop {
      width: 22px; height: 22px; border-radius: 50%;
      background: #0068b7; color: #fff; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .bus-stop.selected { width: 30px; height: 30px; background: #ff7a00; z-index: 5; }

    /* 버스 도착 정보 패널 (컴퓨터: 오른쪽, 휴대폰: 아래쪽) */
    #stop-panel {
      width: 360px; display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); border-left: 1px solid var(--line);
    }
    #stop-panel[hidden] { display: none; }
    main.stop-open #results { display: none; }
    .sp-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 6px; }
    .sp-title { flex: 1; min-width: 0; }
    .sp-name { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .sp-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .sp-close {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%;
      border: none; background: var(--bg); color: var(--text); font-size: 16px; cursor: pointer;
    }
    .sp-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px; font-size: 0.8rem; color: var(--muted); }
    .sp-refresh { border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 14px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
    .sp-list { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); }
    .sp-message { padding: 20px 16px; color: var(--muted); }
    .bus-row { cursor: pointer; }
    .bus-row:hover { background: var(--bg); }
    .badge.go { color: var(--accent); border-color: transparent; padding-left: 0; }

    /* 기다리는 동안 다녀올 곳 (버스를 고르면 패널이 이 화면으로 바뀌어요) */
    #stop-panel.waiting .sp-bar, #stop-panel.waiting .sp-list { display: none; }
    .wait-view { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); }
    .wait-view[hidden] { display: none; }
    .wait-top { padding: 12px 16px 14px; }
    .wait-back { border: none; background: none; padding: 0; color: var(--accent); font-size: 0.85rem; cursor: pointer; }
    .wait-bus { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.95rem; min-width: 0; }
    .wait-bus .route-chip { grid-row: auto; min-width: 64px; padding: 3px 8px; }
    .wait-bus span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wait-clock { display: flex; align-items: baseline; gap: 6px; margin-top: 12px; }
    .wait-clock .label { font-size: 0.85rem; color: var(--muted); }
    .wait-clock .big { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .wait-clock .sec { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .wait-free { margin-top: 6px; font-size: 0.95rem; }
    .wait-free b { color: var(--accent); font-size: 1.15rem; }
    .wait-free.urgent b { color: #e5484d; }
    .wait-free small { color: var(--muted); }
    .wait-manual { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
    .wait-manual input { flex: 1; accent-color: var(--accent); }
    .wait-manual button { border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 12px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer; }
    .wait-manual button[hidden] { display: none; }
    .wait-filters { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
    .wait-filters::-webkit-scrollbar { display: none; }
    .wait-filters button {
      flex-shrink: 0; padding: 5px 11px; border-radius: 14px; font-size: 0.85rem; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
    }
    .wait-filters button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
    .wait-filters button.on[style] { background: var(--tag); border-color: var(--tag); color: #fff; } /* 분류 버튼은 그 분류 색으로 */
    .wait-count { padding: 8px 16px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); background: var(--bg); }
    .wait-count b { color: var(--text); }
    .wait-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .wait-item:hover { background: var(--bg); }
    .wait-item .w-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .wait-item .w-tag {
      flex-shrink: 0; padding: 2px 8px; border-radius: 10px;
      font-size: 0.72rem; font-weight: 700; color: #fff; line-height: 1.5;
    }
    .wait-item .w-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wait-item .w-plan { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); }
    .wait-item .w-spare { grid-column: 2; grid-row: 1; font-size: 0.8rem; font-weight: 600; color: #30a46c; white-space: nowrap; }
    .wait-item .w-spare.tight { color: #d97706; }
    .wait-empty { padding: 20px 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

    .bus-row {
      display: grid; grid-template-columns: 72px 1fr auto; gap: 4px 12px; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
    }
    .bus-row.ended { opacity: 0.45; }
    .route-chip {
      grid-row: span 2; align-self: start;
      padding: 5px 0; border-radius: 6px; text-align: center;
      color: #fff; font-weight: 700; font-size: 1rem; letter-spacing: -0.02em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bus-dir { font-size: 0.85rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bus-dir b { color: var(--text); font-weight: 600; }
    .bus-badges { display: flex; gap: 4px; flex-wrap: wrap; min-height: 0; }
    .badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 8px; border: 1px solid currentColor; }
    .badge.last { color: #e5484d; }
    .badge.low { color: var(--accent); }
    .badge.crowded { color: #e5484d; }
    .badge.seats { color: #30a46c; }
    .badge.seats.few { color: #d97706; }
    .arr { grid-column: 3; grid-row: 1; text-align: right; font-size: 1.3rem; font-weight: 700; white-space: nowrap; letter-spacing: -0.02em; }
    .arr.soon { color: #e5484d; }
    .arr.wait { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
    .arr-sub { grid-column: 3; grid-row: 2; text-align: right; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

    /* 지도 위 내 위치 파란 점 */
    .my-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2f6fed; border: 3px solid #fff;
      box-shadow: 0 0 0 1px rgba(47, 111, 237, 0.4), 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    #results {
      width: 320px;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      list-style: none;
    }
    #results:empty { display: none; }
    #results li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    #results li:hover { background: var(--bg); }
    #results .name { font-weight: 600; }
    #results .addr, #results .phone { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    #results .message { color: var(--muted); cursor: default; }
    #results .dist { font-size: 0.85rem; color: var(--accent); margin-top: 2px; }
    #results .summary {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.85rem; color: var(--muted); background: var(--bg); cursor: default;
    }
    #results .summary button {
      flex-shrink: 0; padding: 4px 10px; font-size: 0.8rem;
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer;
    }

    /* 가게 정보 말풍선 (말풍선 바탕이 항상 흰색이라 색을 고정해요) */
    .place-card { padding: 10px 12px; font-size: 13px; line-height: 1.5; color: #1f1f1f; width: 240px; white-space: normal; }
    .place-card .name { font-weight: 600; font-size: 15px; }
    .place-card .category { color: #6b6b6b; font-size: 12px; }
    .place-card .row { margin-top: 4px; }
    .place-card a { color: #2f6fed; text-decoration: none; }
    .place-card .buttons { display: flex; gap: 6px; margin-top: 8px; }
    .place-card .buttons a {
      flex: 1; text-align: center; padding: 5px 0;
      border: 1px solid #d0d7e6; border-radius: 6px; font-size: 12px;
    }
    .place-card .pick-list { display: flex; flex-direction: column; margin-top: 6px; }
    .place-card .pick-list button {
      text-align: left; padding: 7px 4px; border: none; border-top: 1px solid #eee;
      background: none; cursor: pointer; font: inherit; color: #1f1f1f;
    }
    .place-card .pick-list button:hover { background: #f5f7fb; }
    .place-card .pick-name { font-weight: 600; }
    .place-card .pick-cat { color: #6b6b6b; font-size: 12px; }
    .place-card .back {
      margin-top: 8px; padding: 0; border: none; background: none;
      color: #2f6fed; font-size: 12px; cursor: pointer;
    }

    /* 휴대폰: 목록을 지도 아래로 */
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #results { width: 100%; max-height: 40%; border-left: none; border-top: 1px solid var(--line); }
      #stop-panel {
        width: 100%; height: 58%; flex-shrink: 0; border-left: none; border-top: 1px solid var(--line); /* 높이 고정: 목록이 들어와도 지도 크기가 안 바뀌게 */
        border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.12);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>time<span>zip</span></h1>
    <form id="search-form">
      <input id="keyword" type="search" placeholder="장소나 주소 검색 (예: 석계역 카페)" value="석계역 카페">
      <button type="submit">검색</button>
    </form>
  </header>

  <main>
    <div id="map-wrap">
      <div id="map"></div>
      <div id="category-chips">
        <button type="button" data-category="CE7" data-label="카페" aria-pressed="false">☕ 카페</button>
        <button type="button" data-category="FD6" data-label="음식점" aria-pressed="false">🍴 음식점</button>
        <button type="button" data-category="CS2" data-label="편의점" aria-pressed="false">🏪 편의점</button>
        <button type="button" data-category="PM9,HP8" data-label="약국·병원" aria-pressed="false">💊 약국·병원</button>
        <button type="button" data-category="OL7" data-label="주유소" aria-pressed="false">⛽ 주유소</button>
        <button type="button" data-category="PK6" data-label="주차장" aria-pressed="false">🅿️ 주차장</button>
      </div>
      <div id="bus-hint" hidden></div>
      <button id="bus-toggle" type="button" title="주변 버스정류장" aria-label="주변 버스정류장 보기" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r="0.5"/><circle cx="16" cy="14.5" r="0.5"/>
        </svg>
      </button>
      <button id="my-location" type="button" title="내 위치" aria-label="내 위치로 이동">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>
        </svg>
      </button>
    </div>
    <ul id="results"></ul>
    <section id="stop-panel" hidden aria-label="버스 도착 정보">
      <div class="sp-head">
        <div class="sp-title">
          <div class="sp-name"></div>
          <div class="sp-sub"></div>
        </div>
        <button type="button" class="sp-close" aria-label="닫기">✕</button>
      </div>
      <div class="sp-bar">
        <span class="sp-updated"></span>
        <button type="button" class="sp-refresh">↻ 새로고침</button>
      </div>
      <div class="sp-list"></div>
      <div class="wait-view" hidden>
        <div class="wait-top">
          <button type="button" class="wait-back">← 다른 버스 고르기</button>
          <div class="wait-bus"></div>
          <div class="wait-clock"><span class="label">버스 오기까지</span><span class="big"></span><span class="sec"></span></div>
          <div class="wait-free"></div>
          <div class="wait-manual">
            <span>시간 직접 정하기</span>
            <input type="range" min="3" max="40" step="1" value="10" aria-label="남은 시간 직접 정하기(분)">
            <button type="button" class="wait-live" hidden>실시간으로</button>
          </div>
        </div>
        <div class="wait-filters"></div>
        <div class="wait-count"></div>
        <div class="wait-list"></div>
      </div>
    </section>
  </main>

  <!-- Javascript API 불러오기 + services, clusterer 라이브러리 (&libraries=services,clusterer) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=28e326bf94524ee99ed587b9b4d00150&libraries=services,clusterer"></script>

  <script>
    // 지도 만들기 (석계역 중심)
    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.614829, 127.065526),
      level: 3
    });

    // services 라이브러리의 두 가지 기능
    var places = new kakao.maps.services.Places();     // 장소 검색 (키워드 → 장소 목록)
    var geocoder = new kakao.maps.services.Geocoder(); // 주소-좌표 변환 (주소 → 좌표)

    // clusterer 라이브러리: 가까운 마커끼리 숫자 동그라미로 묶어줘요
    var CLUSTER_MIN_LEVEL = 5; // 지도 레벨이 5 이상(더 축소)일 때부터 묶어요
    var clusterer = new kakao.maps.MarkerClusterer({
      map: map,
      averageCenter: true,           // 동그라미를 묶인 마커들의 가운데에 놓기
      minLevel: CLUSTER_MIN_LEVEL,
      disableClickZoom: false        // 동그라미를 누르면 그 지역으로 확대
    });

    var infowindow = new kakao.maps.InfoWindow({ zIndex: 10 }); // 마커를 누르면 뜨는 말풍선 (정류장 아이콘보다 위에)
    var myPosition = null; // 내 위치 버튼으로 찾은 위치 (찾기 전에는 null)
    var searchCircle = new kakao.maps.Circle({ // 내 주변 검색 반경을 점선 원으로
      strokeWeight: 2, strokeColor: '#2f6fed', strokeOpacity: 0.6, strokeStyle: 'dash',
      fillColor: '#2f6fed', fillOpacity: 0.04
    });
    var markers = [];
    var resultList = document.getElementById('results');

    // 검색 버튼을 누르면 실행
    document.getElementById('search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var keyword = document.getElementById('keyword').value.trim();
      if (!keyword) return;
      setActiveChip(null);
      search(keyword);
    });

    // 카페, 음식점, 편의점 버튼: 내 위치(없으면 지금 보는 지도 가운데) 주변을 카테고리로 찾아요
    var chipButtons = document.querySelectorAll('#category-chips button');
    var activeChip = null;

    chipButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        if (activeChip === button) { // 한 번 더 누르면 끄기
          setActiveChip(null);
          clearMarkers();
          resultList.innerHTML = '';
          return;
        }
        setActiveChip(button);
        var label = button.dataset.label;
        document.getElementById('keyword').value = label;
        searchInView({ category: button.dataset.category }, label);
      });
    });

    // 지금 보는 지도 안에서 찾기 (모든 버튼이 같은 범위로 찾아요)
    // 지도를 너무 넓게 보고 있으면(가운데에서 모서리까지 2km 넘게) 지도 가운데 1km 안에서만 찾아요
    var WIDE_VIEW_METERS = 2000;
    var WIDE_VIEW_RADIUS = 1000;

    function searchInView(query, label) {
      var center = map.getCenter();
      var viewBounds = map.getBounds();
      var sort = kakao.maps.services.SortBy.DISTANCE;

      if (distanceMeters(center, viewBounds.getNorthEast()) > WIDE_VIEW_METERS) {
        var centerAnchor = { position: center, label: '지도 가운데' };
        fetchAllPages(query, { location: center, radius: WIDE_VIEW_RADIUS, sort: sort }, function (found) {
          if (found.length === 0) return showEmpty('지도 가운데 1km 안에는 ' + label + ' 결과가 없어요.');
          showPlaces(found, { keyword: label, radius: WIDE_VIEW_RADIUS, anchor: centerAnchor });
        });
        return;
      }

      // 내 위치가 지금 보는 지도 안에 있으면 내 위치에서, 아니면 지도 가운데에서 가까운 순으로
      var anchor = myPosition && viewBounds.contain(myPosition)
        ? { position: myPosition, label: '내 위치' }
        : { position: center, label: '지도 가운데' };
      fetchAllPages(query, { bounds: viewBounds, location: anchor.position, sort: sort }, function (found) {
        if (found.length === 0) return showEmpty('지금 보는 지도 안에는 ' + label + ' 결과가 없어요. 지도를 옮기거나 축소해 보세요.');
        showPlaces(found, { keyword: label, inView: true, anchor: anchor });
      });
    }

    function showEmpty(text) {
      clearMarkers();
      showMessage(text);
    }

    // 두 지점 사이 거리(미터)
    function distanceMeters(a, b) {
      var R = 6371000;
      var toRad = Math.PI / 180;
      var dLat = (b.getLat() - a.getLat()) * toRad;
      var dLng = (b.getLng() - a.getLng()) * toRad;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(a.getLat() * toRad) * Math.cos(b.getLat() * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function setActiveChip(button) {
      activeChip = button;
      chipButtons.forEach(function (b) {
        b.classList.toggle('on', b === button);
        b.setAttribute('aria-pressed', String(b === button));
      });
    }

    // 검색 기준 정하기
    //  - "창동역 카페"처럼 지역이 들어 있으면 → 그 지역 기준
    //  - "카페"처럼 시설만 쓰면 → 내 위치 기준 (내 위치 버튼을 눌렀을 때)
    //  - 둘 다 아니면 → 전체 지역
    function search(keyword, everywhere) {
      if (everywhere) {
        searchEverywhere(keyword);
        return;
      }
      detectArea(keyword, function (area) {
        if (area && area.position) {
          searchNear(area.facility, { position: area.position, label: area.name }, 0, keyword);
        } else if (area) {
          searchRegion(keyword, area);
        } else if (myPosition) {
          searchNear(keyword, { position: myPosition, label: '내 위치' }, 0, keyword);
        } else {
          searchEverywhere(keyword);
        }
      });
    }

    // 검색어 앞부분이 지역인지 알아보기 ("창동역 카페" → 지역 "창동역", 시설 "카페")
    var FILLER_WORDS = ['근처', '주변', '근방', '앞', '옆'];
    var LANDMARK_GROUPS = ['SW8', 'SC4', 'AT4', 'PO3', 'CT1']; // 지하철역, 학교, 관광명소, 공공기관, 문화시설

    function detectArea(keyword, done) {
      var words = keyword.split(/\s+/).filter(function (w) { return FILLER_WORDS.indexOf(w) === -1; });
      if (words.length < 2) {
        done(null);
        return;
      }
      var areaText = words.slice(0, -1).join(' ');
      var facility = words[words.length - 1];

      // 1) "노원구", "월계동" 같은 동네 이름인지 먼저 확인
      geocoder.addressSearch(areaText, function (result, status) {
        var regions = status === kakao.maps.services.Status.OK
          ? result.filter(function (r) { return r.address_type === 'REGION'; })
          : [];
        if (regions.length > 0) {
          // 이름이 같은 동네가 여러 곳이면(예: 서울 월계동, 광주 월계동) 내 위치나 지금 보는 지도에서 가장 가까운 곳으로
          var from = myPosition || map.getCenter();
          regions.sort(function (a, b) { return squaredDistance(from, a) - squaredDistance(from, b); });
          done({ name: areaText, facility: facility, regionName: regions[0].address_name, regionCenter: new kakao.maps.LatLng(regions[0].y, regions[0].x) });
          return;
        }
        // 2) 역·학교·명소 같은 장소인지 확인 → 그 장소 좌표를 중심으로 검색
        places.keywordSearch(areaText, function (data, status) {
          var top = status === kakao.maps.services.Status.OK ? data[0] : null;
          var isLandmark = top && (LANDMARK_GROUPS.indexOf(top.category_group_code) !== -1 || /교통,수송|대학교/.test(top.category_name));
          done(isLandmark ? { name: areaText, facility: facility, position: new kakao.maps.LatLng(top.y, top.x) } : null);
        }, { size: 1 });
      });
    }

    // 동네 검색: 그 동네 가운데에서 가까운 순으로 찾아요 ("노원구 카페", "월계동 카페")
    function searchRegion(keyword, area) {
      var options = { location: area.regionCenter, radius: 20000, sort: kakao.maps.services.SortBy.DISTANCE };
      fetchAllPages(keyword, options, function (found) {
        if (found.length > 0) {
          showPlaces(found, { notice: area.regionName + '에서 찾았어요.' });
        } else {
          searchEverywhere(keyword);
        }
      });
    }

    // 두 지점이 얼마나 먼지 비교용 (정확한 미터가 아니라 크기 비교만 해요)
    function squaredDistance(latlng, place) {
      var dLat = latlng.getLat() - Number(place.y);
      var dLng = latlng.getLng() - Number(place.x);
      return dLat * dLat + dLng * dLng;
    }

    // 기준점 주변 검색: 500m 안에서 찾고, 결과가 5곳보다 적으면 1km → 2km로 넓혀요
    var RADIUS_STEPS = [500, 1000, 2000]; // 미터 (500m는 걸어서 7~8분)
    var MIN_RESULTS = 5;

    function searchNear(facility, anchor, step, originalKeyword) {
      var radius = RADIUS_STEPS[step];
      var isLastStep = step === RADIUS_STEPS.length - 1;
      var options = { location: anchor.position, radius: radius, sort: kakao.maps.services.SortBy.DISTANCE }; // 가까운 순

      fetchAllPages(facility, options, function (found) {
        if (found.length >= MIN_RESULTS || (isLastStep && found.length > 0)) {
          showPlaces(found, { keyword: originalKeyword, radius: radius, anchor: anchor });
        } else if (!isLastStep) {
          searchNear(facility, anchor, step + 1, originalKeyword);
        } else {
          searchEverywhere(originalKeyword, anchor.label + ' ' + formatDistance(radius) + ' 안에는 없어서 전체 지역에서 찾았어요.');
        }
      });
    }

    function searchEverywhere(keyword, notice) {
      // 1) 먼저 장소 검색을 해 봐요 (예: "석계역 카페")
      fetchAllPages(keyword, {}, function (found) {
        if (found.length > 0) {
          showPlaces(found, { notice: notice });
          return;
        }
        // 2) 장소가 없으면 주소로 좌표를 찾아봐요 (예: "서울 노원구 월계동 1")
        geocoder.addressSearch(keyword, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            showPlaces(result.map(function (r) {
              return { place_name: r.address_name, road_address_name: r.road_address ? r.road_address.address_name : '', x: r.x, y: r.y };
            }), {});
          } else {
            clearMarkers();
            showMessage('검색 결과가 없어요. 다른 검색어로 해 보세요.');
          }
        });
      });
    }

    // 장소 검색은 한 번에 15개씩 오기 때문에, 다음 페이지가 있으면 끝까지(최대 45개) 받아서 모아요
    // query가 글자면 키워드 검색, { category: 'CE7' } 이면 카테고리 검색이에요
    // { category: 'PM9,HP8' } 처럼 여러 개면 각각 찾아서 합친 뒤 가까운 순으로 다시 정렬해요
    function fetchAllPages(query, options, done) {
      if (typeof query !== 'string' && query.category.indexOf(',') !== -1) {
        var codes = query.category.split(',');
        var lists = [];
        codes.forEach(function (code) {
          fetchAllPages({ category: code }, options, function (list) {
            lists.push(list);
            if (lists.length < codes.length) return; // 다 받을 때까지 기다려요
            var merged = [].concat.apply([], lists);
            merged.sort(function (a, b) { return Number(a.distance) - Number(b.distance); });
            done(merged);
          });
        });
        return;
      }

      var found = [];
      var run = typeof query === 'string'
        ? function (cb) { places.keywordSearch(query, cb, options); }
        : function (cb) { places.categorySearch(query.category, cb, options); };
      run(function (data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
          found = found.concat(data);
          if (pagination.hasNextPage) {
            pagination.nextPage(); // 다음 페이지 결과도 이 함수로 다시 들어와요
            return;
          }
        }
        done(found); // 결과가 없거나 다음 페이지를 받다가 실패하면 받은 데까지만
      });
    }

    // 거리 표시: 230 → "230m", 1500 → "1.5km"
    function formatDistance(meters) {
      return meters < 1000 ? Math.round(meters) + 'm' : (meters / 1000).toFixed(1).replace('.0', '') + 'km';
    }

    // 도보 시간: 1분에 약 67m (시속 4km)
    function walkMinutes(meters) {
      return Math.max(1, Math.round(meters / 67));
    }

    // 검색 결과를 지도에 마커로, 옆에 목록으로 보여주기
    function showPlaces(list, info) {
      clearMarkers();
      resultList.innerHTML = '';
      var bounds = new kakao.maps.LatLngBounds(); // 모든 마커가 보이게 지도 범위 맞추기

      if (info.radius) {
        // 내 주변 검색이면: 목록 맨 위에 안내, 지도에 검색 반경 원 표시
        var summary = document.createElement('li');
        summary.className = 'summary';
        summary.textContent = info.anchor.label + ' ' + formatDistance(info.radius) + ' 안 · ' + list.length + '곳 · 가까운 순';
        var everywhereButton = document.createElement('button');
        everywhereButton.type = 'button';
        everywhereButton.textContent = '전체 지역에서 검색';
        everywhereButton.addEventListener('click', function () { search(info.keyword, true); });
        summary.appendChild(everywhereButton);
        resultList.appendChild(summary);

        searchCircle.setPosition(info.anchor.position);
        searchCircle.setRadius(info.radius);
        searchCircle.setMap(map);
        var circleBounds = searchCircle.getBounds(); // 반경 원 전체가 보이게
        bounds.extend(circleBounds.getSouthWest());
        bounds.extend(circleBounds.getNorthEast());
      } else if (info.inView) {
        // 지금 보는 지도 안 검색이면: 안내만 보여주고 지도는 움직이지 않아요
        var viewSummary = document.createElement('li');
        viewSummary.className = 'summary';
        viewSummary.textContent = '지금 보는 지도 안 · ' + list.length + '곳 · ' + info.anchor.label + '에서 가까운 순';
        resultList.appendChild(viewSummary);
      } else if (info.notice) {
        var notice = document.createElement('li');
        notice.className = 'summary';
        notice.textContent = info.notice;
        resultList.appendChild(notice);
      }

      list.forEach(function (place, index) {
        var position = new kakao.maps.LatLng(place.y, place.x);
        var marker = new kakao.maps.Marker({ position: position }); // 지도 대신 clusterer에 넣어요
        bounds.extend(position);

        var item = document.createElement('li');
        addLine(item, 'name', place.place_name);
        if ((info.radius || info.inView) && place.distance) {
          addLine(item, 'dist', (index === 0 ? '가장 가까워요 · ' : '') + formatDistance(Number(place.distance)) + ' · 도보 ' + walkMinutes(Number(place.distance)) + '분');
        }
        addLine(item, 'addr', place.road_address_name || place.address_name);
        addLine(item, 'phone', place.phone);
        resultList.appendChild(item);

        function focus() {
          // 묶여 있는 마커면 동그라미가 풀리도록 확대한 뒤 보여줘요
          if (map.getLevel() >= CLUSTER_MIN_LEVEL) {
            map.setLevel(CLUSTER_MIN_LEVEL - 1, { anchor: position });
          }
          map.panTo(position);
          infowindow.setContent(buildPlaceCard(place));
          infowindow.open(map, marker);
        }
        kakao.maps.event.addListener(marker, 'click', focus);
        item.addEventListener('click', focus);
        markers.push({ marker: marker, focus: focus });
      });

      clusterer.addMarkers(markers.map(function (m) { return m.marker; }));

      if (!info.inView) map.setBounds(bounds);
    }

    function addLine(parent, className, text) {
      if (!text) return;
      var div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      parent.appendChild(div);
    }

    function showMessage(text) {
      resultList.innerHTML = '';
      var item = document.createElement('li');
      item.className = 'message';
      item.textContent = text;
      resultList.appendChild(item);
    }

    function clearMarkers() {
      closeStopPanel(); // 검색하면 버스 패널은 닫고 결과 목록을 보여줘요
      clusterer.clear();
      markers = [];
      searchCircle.setMap(null);
      infowindow.close();
    }

    // 지도를 누르면: 지도에 그려진 가게 아이콘이나 이름을 누른 경우에만 그 가게 정보를 보여줘요
    // 빈 곳을 누르면 아무것도 안 보여주고, 열려 있던 말풍선도 닫아요
    kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
      var latlng = mouseEvent.latLng; // 누른 자리의 좌표

      // 검색 결과 마커를 누른 거면 그 가게를 보여줘요
      // (휴대폰에서는 마커를 눌러도 지도 클릭이 같이 일어날 수 있어서 직접 확인해요)
      var hit = findMarkerAt(latlng);
      if (hit) {
        hit.focus();
        return;
      }

      infowindow.close();
      var thisClick = ++clickCount; // 빠르게 여러 번 누르면 마지막 클릭 결과만 보여줘요

      findPlacesAtPoint(latlng).then(function (hits) {
        if (thisClick !== clickCount || hits.length === 0) return; // 빈 곳이면 아무것도 안 해요
        showNearbyCard(hits);
      });
    });

    var clickCount = 0;

    // 누른 자리에 가게가 하나면 바로 카드를, 여러 개면(한 건물 등) 고를 수 있는 목록을 보여줘요
    function showNearbyCard(hits) {
      var anchor = new kakao.maps.LatLng(hits[0].y, hits[0].x);
      if (hits.length === 1) {
        showPlaceCardAt(hits[0], null);
        return;
      }
      var box = document.createElement('div');
      box.className = 'place-card';
      addLine(box, 'category', '이 자리에 있는 곳 ' + hits.length + '곳 · 누른 이름을 골라 주세요');
      var list = document.createElement('div');
      list.className = 'pick-list';
      hits.forEach(function (place) {
        var btn = document.createElement('button');
        btn.type = 'button';
        addLine(btn, 'pick-name', place.place_name);
        if (place.category_name) addLine(btn, 'pick-cat', place.category_name.split(' > ').slice(-1)[0]);
        btn.addEventListener('click', function () { showPlaceCardAt(place, hits); });
        list.appendChild(btn);
      });
      box.appendChild(list);
      openInfoAt(box, anchor);
    }

    // 가게 카드를 그 가게 자리에 띄우기 (목록에서 골랐으면 목록으로 돌아가는 버튼도)
    function showPlaceCardAt(place, hits) {
      var card = buildPlaceCard(place);
      if (hits) {
        var back = document.createElement('button');
        back.type = 'button';
        back.className = 'back';
        back.textContent = '← 이 자리의 다른 곳 보기';
        back.addEventListener('click', function () { showNearbyCard(hits); });
        card.appendChild(back);
      }
      openInfoAt(card, new kakao.maps.LatLng(place.y, place.x));
    }

    // 말풍선 열기: 지도 위쪽 버튼 줄에 가려지면 지도를 그만큼 내려서 다 보이게 해요
    function openInfoAt(content, position) {
      infowindow.setContent(content);
      infowindow.setPosition(position);
      infowindow.open(map);
      setTimeout(function () {
        var chipsBottom = document.getElementById('category-chips').getBoundingClientRect().bottom;
        var top = content.getBoundingClientRect().top;
        if (top < chipsBottom + 8) map.panBy(0, top - chipsBottom - 16);
      }, 350); // 카카오가 말풍선을 화면 안으로 옮기는 움직임이 끝난 뒤에 확인해요
    }

    // 가게 정보 말풍선 만들기: 이름, 업종, 주소, 전화, 상세보기/길찾기 버튼
    function buildPlaceCard(place) {
      var card = document.createElement('div');
      card.className = 'place-card';
      addLine(card, 'name', place.place_name);
      if (place.category_name) {
        addLine(card, 'category', place.category_name.split(' > ').slice(-2).join(' · ')); // "음식점 > 카페 > 커피전문점" → "카페 · 커피전문점"
      }
      addLine(card, 'row', place.road_address_name || place.address_name);

      if (place.phone) {
        var phone = document.createElement('div');
        phone.className = 'row';
        var tel = document.createElement('a');
        tel.href = 'tel:' + place.phone.replace(/[^0-9]/g, '');
        tel.textContent = '☎ ' + place.phone;
        phone.appendChild(tel);
        card.appendChild(phone);
      }

      if (place.id) { // 주소 검색 결과에는 가게 번호가 없어서 버튼을 안 보여줘요
        var buttons = document.createElement('div');
        buttons.className = 'buttons';
        addLink(buttons, '상세보기', place.place_url.replace('http://', 'https://')); // 카카오맵 가게 페이지 (영업시간, 사진, 리뷰)
        addLink(buttons, '길찾기', 'https://map.kakao.com/link/to/' + place.id);   // 카카오맵 길찾기 (도착지로 설정)
        card.appendChild(buttons);
      }
      return card;
    }

    function addLink(parent, text, url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = text;
      parent.appendChild(a);
    }

    // 누른 자리가 지도에 그려진 가게 아이콘/이름 위인지 알아보기
    // 지도 그림 속 아이콘은 코드로 알 수 없어서, 주변 가게를 검색한 뒤
    // 화면에서 누른 자리와 가까운(아이콘 + 옆 이름 글자 범위 안) 가게만 골라요
    // 중개업소(AG2)는 지도 그림에 거의 안 나오는데 후보로 자주 끼어들어서 뺐어요
    var CATEGORIES = [
      'MT1', 'CS2', 'PS3', 'SC4', 'AC5', 'PK6', 'OL7', 'SW8', 'BK9', // 마트 편의점 어린이집 학교 학원 주차장 주유소 지하철역 은행
      'CT1', 'PO3', 'AT4', 'AD5', 'FD6', 'CE7', 'HP8', 'PM9'         // 문화시설 공공기관 관광명소 숙박 음식점 카페 병원 약국
    ];
    var LAST_CATEGORIES = ['PK6']; // "OO 주차장"처럼 가게에 딸린 곳은 목록 뒤로
    var HIT_X = 70;      // 아이콘에서 좌우로 이만큼(화면 픽셀)까지: 이름 글자가 아이콘 옆에 있어서 넓게
    var HIT_UP = 12;     // 아이콘보다 위쪽은 조금만
    var HIT_DOWN = 30;   // 아이콘 아래쪽은 넓게: 이름 글자가 아이콘 아래에 그려질 때가 많아요
    var MAX_HITS = 5;

    function findPlacesAtPoint(latlng) {
      var projection = map.getProjection();
      var click = projection.containerPointFromCoords(latlng);
      // 화면 70픽셀이 실제로 몇 미터인지 계산해서 그만큼만 검색해요 (확대 정도에 따라 달라져요)
      var edge = projection.coordsFromContainerPoint(new kakao.maps.Point(click.x + HIT_X + 5, click.y + HIT_DOWN));
      var radius = Math.min(Math.max(Math.round(distanceMeters(latlng, edge)), 1), 20000);

      var searches = CATEGORIES.map(function (code) {
        return new Promise(function (resolve) {
          places.categorySearch(code, function (data, status) {
            resolve(status === kakao.maps.services.Status.OK ? data : []);
          }, { location: latlng, radius: radius, sort: kakao.maps.services.SortBy.DISTANCE });
        });
      });

      return Promise.all(searches).then(function (lists) {
        var hits = [].concat.apply([], lists).filter(function (place) {
          var point = projection.containerPointFromCoords(new kakao.maps.LatLng(place.y, place.x));
          place._dx = point.x - click.x;
          place._dy = point.y - click.y;
          // _dy가 음수면 가게(아이콘)가 누른 자리보다 위에 있다는 뜻 = 아이콘 아래 이름을 누른 경우
          return Math.abs(place._dx) <= HIT_X && place._dy >= -HIT_DOWN && place._dy <= HIT_UP;
        });
        hits.sort(function (a, b) { // 누른 자리에서 화면상 가까운 순 (주차장은 뒤로)
          var lastA = LAST_CATEGORIES.indexOf(a.category_group_code) !== -1 ? 1 : 0;
          var lastB = LAST_CATEGORIES.indexOf(b.category_group_code) !== -1 ? 1 : 0;
          if (lastA !== lastB) return lastA - lastB;
          return (a._dx * a._dx + a._dy * a._dy) - (b._dx * b._dx + b._dy * b._dy);
        });
        return hits.slice(0, MAX_HITS);
      });
    }

    // 내 위치 버튼: 브라우저에게 현재 위치를 물어보고, 지도에 파란 점으로 보여줘요
    // (위치 기능은 https 주소나 localhost에서만 작동해요)
    var myLocationButton = document.getElementById('my-location');
    var myDot = new kakao.maps.CustomOverlay({ content: '<div class="my-dot"></div>', zIndex: 3 });
    var myAccuracy = new kakao.maps.Circle({
      strokeWeight: 1, strokeColor: '#2f6fed', strokeOpacity: 0.4,
      fillColor: '#2f6fed', fillOpacity: 0.12
    });

    myLocationButton.addEventListener('click', function () {
      if (!navigator.geolocation) {
        alert('이 브라우저에서는 위치 기능을 쓸 수 없어요.');
        return;
      }
      myLocationButton.classList.add('loading');

      navigator.geolocation.getCurrentPosition(function (pos) {
        myLocationButton.classList.remove('loading');
        var here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        myPosition = here; // 이제부터 검색은 내 주변에서 해요
        var keywordInput = document.getElementById('keyword');
        keywordInput.placeholder = '내 주변 검색 (예: 카페)';
        if (keywordInput.value === '석계역 카페') keywordInput.value = '카페';

        myDot.setPosition(here);
        myDot.setMap(map);
        myAccuracy.setPosition(here);
        myAccuracy.setRadius(pos.coords.accuracy); // 위치 오차 범위(미터)를 옅은 원으로
        myAccuracy.setMap(map);

        if (map.getLevel() > 4) map.setLevel(4);
        map.panTo(here);
      }, function (err) {
        myLocationButton.classList.remove('loading');
        if (err.code === err.PERMISSION_DENIED) {
          alert('위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치 권한을 허용해 주세요.');
        } else {
          alert('현재 위치를 찾지 못했어요. 잠시 후 다시 해 보세요.');
        }
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    });

    // ───────── 버스정류장 ─────────
    // 정류장 버튼을 켜면 지금 보는 지도 가운데 주변 정류장을 보여주고, 누르면 지나는 버스와 도착 정보를 보여줘요.
    // 버스 정보는 서울시 버스 API를 우리 서버(/api/bus)를 거쳐서 가져와요. (인증키를 숨기려고)
    var busToggle = document.getElementById('bus-toggle');
    var busHint = document.getElementById('bus-hint');
    var busOn = false;
    var stopOverlays = [];
    var stopsRequest = 0;

    // 버스 종류별 이름과 색 (S = 서울 노선 종류, G = 경기 노선 종류 코드)
    var ROUTE_TYPES = {
      S1: { name: '공항', color: '#00a0e9' },
      S2: { name: '마을', color: '#5bb025' },
      S3: { name: '간선', color: '#0068b7' },
      S4: { name: '지선', color: '#53b332' },
      S5: { name: '순환', color: '#f2b70a', text: '#1f1f1f' },
      S6: { name: '광역', color: '#e60012' },
      S7: { name: '인천', color: '#8a8a8a' },
      S8: { name: '경기', color: '#8a8a8a' },
      G11: { name: '직행좌석', color: '#e60012' },
      G12: { name: '좌석', color: '#0075c8' },
      G13: { name: '일반', color: '#33a23d' },
      G14: { name: '광역급행', color: '#00a0e9' },
      G15: { name: '따복', color: '#f99d1c' },
      G16: { name: '순환', color: '#f2b70a', text: '#1f1f1f' },
      G21: { name: '직행좌석', color: '#e60012' },
      G22: { name: '좌석', color: '#0075c8' },
      G23: { name: '일반', color: '#33a23d' },
      G30: { name: '마을', color: '#f2b70a', text: '#1f1f1f' },
      G41: { name: '고속', color: '#7c5cd6' },
      G42: { name: '시외', color: '#7c5cd6' },
      G43: { name: '시외', color: '#7c5cd6' },
      G51: { name: '공항', color: '#00a0e9' },
      G52: { name: '공항', color: '#00a0e9' },
      G53: { name: '공항', color: '#00a0e9' }
    };
    // 같은 시간에 오면 이 순서로 (모르는 종류는 맨 뒤)
    var ROUTE_ORDER = ['S3', 'S4', 'S5', 'S6', 'S2', 'S1', 'G11', 'G14', 'G12', 'G13', 'G16', 'G15', 'G30', 'G21', 'G22', 'G23', 'G41', 'G42', 'G43', 'G51', 'G52', 'G53', 'S8', 'S7'];

    busToggle.addEventListener('click', function () {
      busOn = !busOn;
      busToggle.classList.toggle('on', busOn);
      busToggle.setAttribute('aria-pressed', String(busOn));
      if (busOn) {
        loadStops();
      } else {
        clearStops();
        busHint.hidden = true;
      }
    });

    // 지도를 옮기거나 확대/축소하면 그 자리 정류장으로 다시 불러와요 (멈춘 뒤 0.4초 기다렸다가)
    var idleTimer = null;
    kakao.maps.event.addListener(map, 'idle', function () {
      if (!busOn) return;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(loadStops, 400);
    });

    var introShown = false;

    function loadStops() {
      var level = map.getLevel();
      if (level > 5) { // 너무 넓게 보면 정류장이 너무 많아서 확대를 부탁해요
        clearStops();
        showBusHint('지도를 확대하면 정류장이 보여요');
        return;
      }
      var radius = level <= 3 ? 300 : level === 4 ? 500 : 1000; // 미터
      var center = map.getCenter();
      var thisRequest = ++stopsRequest;
      showBusHint('정류장 불러오는 중…');

      fetch('/api/bus?type=nearby&lat=' + center.getLat() + '&lng=' + center.getLng() + '&radius=' + radius)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (thisRequest !== stopsRequest || !busOn) return; // 그 사이 새로 불렀으면 옛날 결과는 버려요
          if (data.error) throw new Error(data.error);
          clearStops();
          data.stations.forEach(addStop);
          if (data.stations.length > 0 && !introShown) { // 처음 한 번은 쓰는 법을 알려줘요
            introShown = true;
            showBusHint('정류장을 누르고 기다리는 버스를 고르면, 그동안 다녀올 곳을 알려드려요', 6000);
          } else {
            showBusHint(data.stations.length > 0 ? '주변 정류장 ' + data.stations.length + '곳' : '이 근처에는 정류장이 없어요', 2000);
          }
        })
        .catch(function () {
          if (thisRequest === stopsRequest) showBusHint('정류장 정보를 가져오지 못했어요', 3000);
        });
    }

    function addStop(stop) {
      var el = document.createElement('div');
      el.className = 'bus-stop' + (selectedStop && selectedStop.id === stop.id ? ' selected' : '');
      el.dataset.id = stop.id;
      el.title = stop.name;
      el.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>';
      var position = new kakao.maps.LatLng(stop.lat, stop.lng);
      var overlay = new kakao.maps.CustomOverlay({ position: position, content: el, clickable: true, zIndex: 2 }); // clickable: 눌러도 지도 클릭으로 안 넘어가요
      overlay.setMap(map);
      el.addEventListener('click', function () { showStopCard(stop, position); });
      stopOverlays.push(overlay);
    }

    function clearStops() {
      stopOverlays.forEach(function (o) { o.setMap(null); });
      stopOverlays = [];
    }

    var hintTimer = null;
    function showBusHint(text, hideAfter) {
      busHint.textContent = text;
      busHint.hidden = false;
      clearTimeout(hintTimer);
      if (hideAfter) hintTimer = setTimeout(function () { busHint.hidden = true; }, hideAfter);
    }

    // ───────── 버스 도착 정보 패널 ─────────
    // 정류장을 누르면 패널을 열고, 곧 오는 버스 순으로 크게 보여줘요. 열려 있는 동안 30초마다 새로고침해요.
    var stopPanel = document.getElementById('stop-panel');
    var mainEl = document.querySelector('main');
    var spName = stopPanel.querySelector('.sp-name');
    var spSub = stopPanel.querySelector('.sp-sub');
    var spUpdated = stopPanel.querySelector('.sp-updated');
    var spList = stopPanel.querySelector('.sp-list');
    var selectedStop = null;
    var refreshTimer = null;
    var clockTimer = null;
    var updatedAt = 0;
    var AUTO_REFRESH_MS = 30000;

    stopPanel.querySelector('.sp-close').addEventListener('click', closeStopPanel);

    // 지도 영역 크기가 바뀌면(패널 열고 닫기, 화면 회전 등) 카카오 지도에 알려서 다시 맞춰요
    if (window.ResizeObserver) {
      var keepCenter = null;
      new ResizeObserver(function () {
        var center = keepCenter || map.getCenter();
        map.relayout();
        map.setCenter(center);
        keepCenter = null;
      }).observe(document.getElementById('map'));
    }
    stopPanel.querySelector('.sp-refresh').addEventListener('click', function () {
      if (selectedStop) loadArrivals(selectedStop);
    });

    function showStopCard(stop, position) {
      exitWait();
      stop.position = position;
      selectedStop = stop;
      infowindow.close();
      spName.textContent = stop.name;
      spSub.textContent = stopLabel(stop, '');
      spUpdated.textContent = '';
      spList.innerHTML = '<div class="sp-message">버스 정보를 불러오는 중…</div>';

      var wasHidden = stopPanel.hidden;
      stopPanel.hidden = false;
      mainEl.classList.add('stop-open');
      // 패널이 생기면 지도 크기가 바뀌어서, 화면이 다시 그려진 다음 지도 크기를 맞추고 정류장으로 이동해요
      keepCenter = position; // 크기가 바뀌면 이 정류장을 가운데로
      setTimeout(function () {
        if (wasHidden) map.relayout();
        map.setCenter(position);
      }, 0);
      highlightStop();

      loadArrivals(stop);
      clearInterval(refreshTimer);
      refreshTimer = setInterval(function () { loadArrivals(stop); }, AUTO_REFRESH_MS);
      clearInterval(clockTimer);
      clockTimer = setInterval(updateClock, 5000);
    }

    function closeStopPanel() {
      if (stopPanel.hidden) return;
      exitWait();
      selectedStop = null;
      stopPanel.hidden = true;
      mainEl.classList.remove('stop-open');
      clearInterval(refreshTimer);
      clearInterval(clockTimer);
      var center = map.getCenter();
      setTimeout(function () { map.relayout(); map.setCenter(center); }, 0);
      highlightStop();
    }

    // 지도 위에서 지금 보고 있는 정류장을 주황색으로 크게
    function highlightStop() {
      stopOverlays.forEach(function (o) {
        var el = o.getContent();
        el.classList.toggle('selected', !!selectedStop && el.dataset.id === selectedStop.id);
      });
    }

    function updateClock() {
      if (!updatedAt) return;
      var seconds = Math.round((Date.now() - updatedAt) / 1000);
      spUpdated.textContent = (seconds < 10 ? '방금' : seconds + '초 전') + ' 업데이트 · 30초마다 자동 새로고침';
    }

    function loadArrivals(stop) {
      // 서울 정류장은 서울 버스(+ 그곳에 서는 경기 버스), 경기 정류장은 경기 버스를 물어봐요
      fetch('/api/bus?type=arrivals&id=' + stop.id + '&arsId=' + stop.arsId +
        '&seoul=' + (stop.seoul ? 1 : 0) + '&gg=' + (stop.gg ? 1 : 0))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (selectedStop !== stop) return; // 그 사이 다른 정류장을 눌렀으면 버려요
          if (data.error) throw new Error(data.error);
          renderArrivals(stop, data.buses);
          updatedAt = Date.now();
          updateClock();
        })
        .catch(function () {
          if (selectedStop !== stop) return;
          spList.innerHTML = '<div class="sp-message">버스 정보를 가져오지 못했어요. 새로고침을 눌러 보세요.</div>';
        });
    }

    function renderArrivals(stop, buses) {
      if (buses.length === 0) {
        spList.innerHTML = '<div class="sp-message">이 정류장을 지나는 버스 정보가 없어요.</div>';
        return;
      }

      // 정류장 방면: 노선들의 "다음 정류장" 중 가장 많은 것 (예: "석계역굴다리앞 방면")
      var counts = {};
      buses.forEach(function (b) {
        var next = (b.nextStation || '').trim();
        if (next) counts[next] = (counts[next] || 0) + 1;
      });
      var towards = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
      spSub.textContent = stopLabel(stop, towards);

      // 곧 오는 순 → 같으면 버스 종류 순 → 번호 순
      buses.forEach(function (b) { b._arr = formatArrival(b.arr1); });
      buses.sort(function (a, b) {
        return (a._arr.order - b._arr.order) ||
          (routeRank(a) - routeRank(b)) ||
          a.route.localeCompare(b.route, 'ko', { numeric: true });
      });

      spList.innerHTML = '';
      buses.forEach(function (bus) { spList.appendChild(buildBusRow(bus)); });
      if (waitState && waitState.stop === stop) updateWaitFromBuses(buses); // 기다리는 중이면 남은 시간도 새로
    }

    // 정류장 설명: "정류장 번호 11283 · 석계역굴다리앞 방면" / "경기 수원 · 정류장 번호 03165"
    function stopLabel(stop, towards) {
      var parts = [];
      if (stop.region && stop.region !== '서울') parts.push(stop.region === '경기' ? '경기' : '경기 ' + stop.region); // 예: "경기 수원"
      if (stop.arsId) parts.push('정류장 번호 ' + stop.arsId);
      if (towards) parts.push(towards + ' 방면');
      return parts.join(' · ');
    }

    // 서버가 보낸 도착 정보 → 화면에 쓸 글자
    //   { status: 'running', minutes: 3, stops: 2 } → { main: "3분", sub: "2정거장 전", order: 180, soon: true }
    function formatArrival(arr) {
      arr = arr || { status: 'none' };
      var info = { main: '', sub: '', order: 60000, soon: false, wait: true, ended: false };
      if (arr.status === 'running') {
        info.main = arr.minutes === 0 ? '1분 이내' : arr.minutes + '분';
        info.sub = arr.stops != null ? arr.stops + '정거장 전' : '';
        info.order = arr.minutes * 60 + (arr.seconds || 0);
        info.soon = arr.minutes <= 3;
        info.wait = false;
      } else if (arr.status === 'soon') {
        info.main = '곧 도착'; info.order = 0; info.soon = true; info.wait = false;
      } else if (arr.status === 'garage') {
        info.main = '차고지 출발'; info.order = 40000;
      } else if (arr.status === 'wait') {
        info.main = '출발 대기'; info.order = 50000;
      } else if (arr.status === 'ended') {
        info.main = '운행 종료'; info.order = 99999; info.ended = true;
      } else {
        info.main = arr.text || '도착 정보 없음'; info.order = 70000;
      }
      return info;
    }

    // 목록 정렬 순서 (종류를 모르는 노선은 맨 뒤로)
    function routeRank(bus) {
      if (/^N/.test(bus.route)) return ROUTE_ORDER.length; // 심야버스
      var rank = ROUTE_ORDER.indexOf(bus.type);
      return rank === -1 ? ROUTE_ORDER.length + 1 : rank;
    }

    // 버스 한 줄:  [번호]  지선 · 석계역행          3분
    //                    막차 저상 혼잡     2정거장 전 · 다음 15분
    function buildBusRow(bus) {
      var type = /^N/.test(bus.route) ? { name: '심야', color: '#1f2a44' } // N13 같은 심야버스
        : ROUTE_TYPES[bus.type] || { name: '', color: '#8a8a8a' };
      var arr = bus._arr || formatArrival(bus.arr1);
      var next = formatArrival(bus.arr2);

      var row = document.createElement('div');
      row.className = 'bus-row' + (arr.ended ? ' ended' : '');

      var chip = document.createElement('div');
      chip.className = 'route-chip';
      chip.style.background = type.color;
      if (type.text) chip.style.color = type.text; // 노란색 바탕은 글자를 진하게
      chip.textContent = bus.route;
      chip.title = (type.name ? type.name + '버스 ' : '') + bus.route;
      row.appendChild(chip);

      var dir = document.createElement('div');
      dir.className = 'bus-dir';
      var dirName = document.createElement('b');
      dirName.textContent = bus.direction + '행';
      if (type.name) dir.appendChild(document.createTextNode(type.name + ' · '));
      dir.appendChild(dirName);
      row.appendChild(dir);

      var main = document.createElement('div');
      main.className = 'arr' + (arr.soon ? ' soon' : '') + (arr.wait ? ' wait' : '');
      main.textContent = arr.main;
      row.appendChild(main);

      var badges = document.createElement('div');
      badges.className = 'bus-badges';
      if (bus.last1) addBadge(badges, 'last', '막차');
      if (bus.lowFloor1 && !arr.wait) addBadge(badges, 'low', '저상');
      if (bus.crowded1 && !arr.wait) addBadge(badges, 'crowded', '혼잡'); // 여유·보통은 대부분이라 혼잡할 때만 표시
      if (bus.seats1 != null && !arr.wait) addBadge(badges, bus.seats1 <= 5 ? 'seats few' : 'seats', '빈자리 ' + bus.seats1); // 경기 좌석버스
      if (arr.ended && bus.firstTime) addBadge(badges, '', '첫차 ' + bus.firstTime);
      if (!arr.ended) addBadge(badges, 'go', '기다리며 다녀올 곳 ›');
      row.appendChild(badges);
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.addEventListener('click', function () { enterWait(selectedStop, bus); });
      row.addEventListener('keydown', function (e) { if (e.key === 'Enter') enterWait(selectedStop, bus); });

      var sub = document.createElement('div');
      sub.className = 'arr-sub';
      var parts = [];
      if (arr.sub) parts.push(arr.sub);
      if (!next.wait) parts.push('다음 ' + next.main); // 두 번째 버스는 오고 있을 때만
      sub.textContent = parts.join(' · ');
      row.appendChild(sub);
      return row;
    }

    function addBadge(parent, className, text) {
      var span = document.createElement('span');
      span.className = 'badge ' + className;
      span.textContent = text;
      parent.appendChild(span);
    }

    // ───────── 기다리는 동안 다녀올 곳 ─────────
    // 버스를 고르면: 버스 오기까지 남은 시간 - 복귀 여유 2분 = 다녀올 수 있는 시간
    // 정류장 주변 가게 중 (가는 시간 + 머무는 시간 + 오는 시간) 안에 들어오는 곳만 보여줘요
    var BUFFER_MIN = 2;          // 버스 오기 전에 정류장에 돌아와 있을 여유
    var WALK_M_PER_MIN = 67;     // 걷는 속도 (시속 4km)
    var DETOUR = 1.3;            // 직선거리보다 실제 길이 이만큼 더 길다고 봐요
    var MAX_RADIUS = 1000;       // 아무리 시간이 많아도 정류장에서 1km 안에서만
    var ACTIVITIES = [           // 업종별로 머무는 시간 추정 (분)
      { code: 'CS2', label: '편의점', stay: 3, color: '#2f9e44' },
      { code: 'CE7', label: '카페', stay: 5, color: '#9c6644' },
      { code: 'PM9', label: '약국', stay: 5, color: '#e03131' },
      { code: 'MT1', label: '마트', stay: 10, color: '#1c7ed6' },
      { code: 'FD6', label: '음식점', stay: 20, color: '#e8590c' }
    ];

    var waitView = stopPanel.querySelector('.wait-view');
    var waitBusEl = waitView.querySelector('.wait-bus');
    var waitBig = waitView.querySelector('.wait-clock .big');
    var waitSec = waitView.querySelector('.wait-clock .sec');
    var waitClockLabel = waitView.querySelector('.wait-clock .label');
    var waitFree = waitView.querySelector('.wait-free');
    var waitSlider = waitView.querySelector('.wait-manual input');
    var waitLiveButton = waitView.querySelector('.wait-live');
    var waitFilters = waitView.querySelector('.wait-filters');
    var waitCount = waitView.querySelector('.wait-count');
    var waitList = waitView.querySelector('.wait-list');

    var waitState = null;   // { stop, bus, endAt(버스 도착 시각), manual, places, fetchedFor, filter }
    var waitTimer = null;
    var waitMarkers = [];

    waitView.querySelector('.wait-back').addEventListener('click', function () { exitWait(); });
    waitSlider.addEventListener('input', function () {
      if (!waitState) return;
      waitState.manual = true;
      waitState.endAt = Date.now() + (Number(waitSlider.value) + BUFFER_MIN) * 60000; // "나 N분 있어" → 다녀올 시간이 N분
      waitLiveButton.hidden = !waitState.liveEndAt;
      tickWait(true);
    });
    waitLiveButton.addEventListener('click', function () {
      if (!waitState || !waitState.liveEndAt) return;
      waitState.manual = false;
      waitState.endAt = waitState.liveEndAt;
      waitLiveButton.hidden = true;
      tickWait(true);
    });

    // 분류 버튼: 전체 + 업종별
    [{ code: 'all', label: '전체' }].concat(ACTIVITIES).forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = a.label;
      b.dataset.code = a.code;
      if (a.color) b.style.setProperty('--tag', a.color); // 고르면 그 분류 색으로
      if (a.code === 'all') b.classList.add('on');
      b.addEventListener('click', function () {
        if (!waitState) return;
        waitState.filter = a.code;
        waitFilters.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        renderWaitList();
      });
      waitFilters.appendChild(b);
    });

    function enterWait(stop, bus) {
      if (!stop) return;
      var arr = bus.arr1 || {};
      var liveEndAt = arrivalTime(arr);
      waitState = {
        stop: stop, bus: bus, liveEndAt: liveEndAt, manual: !liveEndAt,
        endAt: liveEndAt || Date.now() + (Number(waitSlider.value) + BUFFER_MIN) * 60000,
        places: [], fetchedFor: 0, filter: 'all', lastMinute: null
      };
      waitFilters.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.code === 'all'); });
      waitLiveButton.hidden = true;

      // 버스 표시
      waitBusEl.innerHTML = '';
      var type = /^N/.test(bus.route) ? { name: '심야', color: '#1f2a44' } : ROUTE_TYPES[bus.type] || { name: '', color: '#8a8a8a' };
      var chip = document.createElement('div');
      chip.className = 'route-chip';
      chip.style.background = type.color;
      if (type.text) chip.style.color = type.text;
      chip.textContent = bus.route;
      waitBusEl.appendChild(chip);
      var dir = document.createElement('span');
      dir.textContent = (type.name ? type.name + ' · ' : '') + bus.direction + '행';
      waitBusEl.appendChild(dir);

      stopPanel.classList.add('waiting');
      waitView.hidden = false;
      waitView.scrollTop = 0;
      tickWait(true);
      clearInterval(waitTimer);
      waitTimer = setInterval(function () { tickWait(false); }, 1000);
    }

    function exitWait() {
      if (!waitState) return;
      waitState = null;
      clearInterval(waitTimer);
      stopPanel.classList.remove('waiting');
      waitView.hidden = true;
      clearWaitMarkers();
      infowindow.close();
    }

    // 도착 정보 → 도착 시각 (지금 오고 있지 않으면 null)
    function arrivalTime(arr) {
      if (arr.status === 'running') return Date.now() + (arr.minutes * 60 + (arr.seconds || 0)) * 1000;
      if (arr.status === 'soon') return Date.now() + 60000;
      return null;
    }

    // 30초마다 도착 정보가 새로 오면 기다리는 버스의 도착 시각도 고쳐요
    function updateWaitFromBuses(buses) {
      var b = waitState.bus;
      var same = buses.filter(function (x) { return x.route === b.route && x.direction === b.direction; })[0];
      if (!same) return;
      waitState.bus = same;
      waitState.liveEndAt = arrivalTime(same.arr1 || {});
      if (!waitState.manual && waitState.liveEndAt) waitState.endAt = waitState.liveEndAt;
      if (waitState.manual && waitState.liveEndAt) waitLiveButton.hidden = false;
      tickWait(true);
    }

    // 1초마다: 시계를 바꾸고, 분이 바뀌면 목록도 다시 계산
    function tickWait(force) {
      if (!waitState) return;
      var leftSec = Math.max(0, Math.round((waitState.endAt - Date.now()) / 1000));
      var freeMin = Math.floor(leftSec / 60) - BUFFER_MIN; // 다녀올 수 있는 시간 (분)

      if (!waitState.manual) {
        waitClockLabel.textContent = '버스 오기까지';
        waitBig.textContent = Math.floor(leftSec / 60) + '분';
        waitSec.textContent = (leftSec % 60) + '초';
      } else {
        waitClockLabel.textContent = waitState.liveEndAt ? '직접 정한 시간' : '도착 정보가 없어서 직접 정한 시간';
        waitBig.textContent = Math.floor(leftSec / 60) + '분';
        waitSec.textContent = (leftSec % 60) + '초';
      }

      waitFree.classList.toggle('urgent', freeMin < 3);
      if (freeMin <= 0) {
        waitFree.innerHTML = '<b>지금은 정류장에서 기다려 주세요</b> <small>· 버스가 곧 와요</small>';
      } else {
        waitFree.innerHTML = '다녀올 수 있는 시간 <b>' + freeMin + '분</b> <small>· 복귀 여유 ' + BUFFER_MIN + '분</small>';
      }

      if (!force && freeMin === waitState.lastMinute) return;
      waitState.lastMinute = freeMin;
      if (!waitState.manual) waitSlider.value = Math.min(40, Math.max(3, freeMin));

      // 처음이거나 시간이 늘어나서 더 멀리 찾아야 하면 다시 검색, 아니면 있는 결과에서 거르기만
      if (freeMin > waitState.fetchedFor) fetchWaitPlaces(freeMin);
      else renderWaitList();
    }

    // 정류장 주변에서 업종별로 찾기. 업종마다 머무는 시간이 달라서 갈 수 있는 거리도 달라요
    function fetchWaitPlaces(freeMin) {
      var state = waitState;
      state.fetchedFor = freeMin;
      waitCount.textContent = '다녀올 수 있는 곳을 찾는 중…';
      var jobs = ACTIVITIES.map(function (a) {
        var radius = maxOneWayMeters(freeMin, a.stay);
        if (radius < 30) return Promise.resolve([]);
        return new Promise(function (resolve) {
          fetchAllPages({ category: a.code }, { location: state.stop.position, radius: radius, sort: kakao.maps.services.SortBy.DISTANCE }, function (list) {
            list.forEach(function (p) { p._activity = a; });
            resolve(list);
          });
        });
      });
      Promise.all(jobs).then(function (lists) {
        if (waitState !== state) return; // 그 사이 다른 버스를 골랐으면 버려요
        state.places = [].concat.apply([], lists);
        renderWaitList();
      });
    }

    // 남은 시간 안에 왕복할 수 있는 가장 먼 거리 (미터, 직선거리 기준)
    function maxOneWayMeters(freeMin, stay) {
      var walkMin = (freeMin - stay) / 2;
      return Math.min(MAX_RADIUS, Math.floor(walkMin * WALK_M_PER_MIN / DETOUR));
    }

    function walkMinutesFromStop(place) {
      return Math.max(1, Math.ceil(Number(place.distance) * DETOUR / WALK_M_PER_MIN));
    }

    function renderWaitList() {
      if (!waitState) return;
      var leftSec = (waitState.endAt - Date.now()) / 1000;
      var freeMin = Math.floor(leftSec / 60) - BUFFER_MIN;
      var filter = waitState.filter;

      var doable = waitState.places.map(function (p) {
        var walk = walkMinutesFromStop(p);
        return { place: p, walk: walk, stay: p._activity.stay, total: walk * 2 + p._activity.stay };
      }).filter(function (x) {
        return x.total <= freeMin && (filter === 'all' || x.place._activity.code === filter);
      });
      doable.sort(function (a, b) { return a.total - b.total || Number(a.place.distance) - Number(b.place.distance); });

      waitCount.innerHTML = '지금 다녀올 수 있는 곳 <b>' + doable.length + '곳</b>' +
        (doable.length ? ' · 빨리 다녀올 수 있는 순' : '');
      waitList.innerHTML = '';
      clearWaitMarkers();

      if (doable.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'wait-empty';
        empty.textContent = freeMin <= 0
          ? '버스가 곧 와요. 정류장에서 기다려 주세요.'
          : '이 시간 안에 다녀올 만한 곳이 없어요. 다른 분류를 보거나 시간을 늘려 보세요.';
        waitList.appendChild(empty);
        return;
      }

      doable.forEach(function (x) {
        var p = x.place;
        // 한 줄:  [카페] 메가MGC커피 석계역점        여유 5분
        //         총 7분 · 걸어서 1분
        var item = document.createElement('div');
        item.className = 'wait-item';
        var head = document.createElement('div');
        head.className = 'w-head';
        var tag = document.createElement('span');
        tag.className = 'w-tag';
        tag.style.background = p._activity.color;
        tag.textContent = p._activity.label;
        head.appendChild(tag);
        addLine(head, 'w-name', p.place_name);
        item.appendChild(head);
        var spare = freeMin - x.total;
        addLine(item, 'w-spare' + (spare <= 1 ? ' tight' : ''), spare === 0 ? '딱 맞아요' : '여유 ' + spare + '분');
        addLine(item, 'w-plan', '총 ' + x.total + '분 · 걸어서 ' + x.walk + '분');
        item.title = '가는 ' + x.walk + '분 + 머무는 ' + x.stay + '분 + 오는 ' + x.walk + '분'; // 자세한 계산은 마우스를 올리면
        item.addEventListener('click', function () { focusWaitPlace(p); });
        waitList.appendChild(item);

        var marker = new kakao.maps.Marker({ map: map, position: new kakao.maps.LatLng(p.y, p.x), title: p.place_name });
        var focus = function () { focusWaitPlace(p); };
        kakao.maps.event.addListener(marker, 'click', focus);
        waitMarkers.push({ marker: marker, focus: focus }); // 휴대폰에서 지도 클릭과 겹쳐도 찾을 수 있게 검색 마커와 같은 모양으로
      });
    }

    // 목록이나 마커를 누르면: 가게 카드 + 정류장에서 가는 길 / 정류장으로 돌아오는 길
    function focusWaitPlace(place) {
      var card = buildPlaceCard(place);
      card.querySelectorAll('.buttons a').forEach(function (a) { // 일반 길찾기는 아래 도보 길과 겹쳐서 빼요
        if (a.textContent === '길찾기') a.remove();
      });
      var stop = waitState.stop;
      var stopPoint = encodeURIComponent(stop.name) + ',' + stop.position.getLat() + ',' + stop.position.getLng();
      var placePoint = encodeURIComponent(place.place_name) + ',' + place.y + ',' + place.x;
      var buttons = document.createElement('div');
      buttons.className = 'buttons';
      addLink(buttons, '가는 길 (도보)', 'https://map.kakao.com/link/by/walk/' + stopPoint + '/' + placePoint);
      addLink(buttons, '돌아오는 길', 'https://map.kakao.com/link/by/walk/' + placePoint + '/' + stopPoint);
      card.appendChild(buttons);
      openInfoAt(card, new kakao.maps.LatLng(place.y, place.x));
    }

    function clearWaitMarkers() {
      waitMarkers.forEach(function (m) { m.marker.setMap(null); });
      waitMarkers = [];
    }

    // 클릭한 자리가 가게 마커 그림 위인지 확인 (화면 픽셀 거리로 비교)
    function findMarkerAt(latlng) {
      var projection = map.getProjection();
      var click = projection.containerPointFromCoords(latlng);
      var candidates = markers.concat(waitMarkers); // 검색 마커 + 기다리는 동안 다녀올 곳 마커
      for (var i = 0; i < candidates.length; i++) {
        if (!candidates[i].marker.getMap()) continue; // 동그라미 안에 묶여서 안 보이는 마커는 빼요
        var point = projection.containerPointFromCoords(candidates[i].marker.getPosition());
        var dx = click.x - point.x;
        var dy = click.y - point.y; // 마커 그림은 좌표보다 위쪽에 그려져요
        if (Math.abs(dx) <= 16 && dy >= -40 && dy <= 6) return candidates[i];
      }
      return null;
    }

    // 버스정류장은 timezip의 핵심이라 처음부터 켜 둬요
    busToggle.click();
  </script>
</body>
</html>
