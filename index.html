        if (/제과|베이커리|디저트|아이스크림|도넛|떡,한과/.test(cat(p))) return 'bakery';
        if (/패스트푸드|햄버거|샌드위치|토스트/.test(cat(p))) return 'fastfood';
        if (/분식/.test(cat(p))) return 'snack';
        return 'meal';
      } },
      { category: 'CS2', sub: 'cvs' },
      { category: 'PM9', sub: 'pharmacy' },
      { category: 'BK9', sub: 'bank' },
      { category: 'MT1', sub: 'mart' },
      { keyword: '다이소', sub: 'daiso', match: function (p) { return /다이소/.test(p.place_name); } },
      { keyword: '서점', sub: 'book', match: function (p) { return /서점/.test(cat(p)); } },
      { keyword: '옷가게', sub: 'clothes', match: function (p) { return /의류판매/.test(cat(p)); } },
      { keyword: '문구', sub: 'stationery', match: function (p) { return /문구,사무용품/.test(cat(p)) && !/제조업/.test(cat(p)); } },
      { keyword: '올리브영', sub: 'cosmetics', match: function (p) { return /화장품|드럭스토어/.test(cat(p)); } },
      { keyword: '화장품', sub: 'cosmetics', match: function (p) { return /미용 > 화장품/.test(cat(p)) && !/지사|본사|사무소|대리점/.test(p.place_name); } },
      { keyword: '미용실', sub: 'hair', match: function (p) { return /미용실/.test(cat(p)); } },
      { keyword: '오락실', sub: 'arcade', match: function (p) { return /오락실|게임장|인형뽑기/.test(cat(p)); } },
      { keyword: '인형뽑기', sub: 'arcade', match: function (p) { return /오락실|게임장|인형뽑기/.test(cat(p)); } },
      { keyword: '즉석사진', sub: 'photo', match: function (p) { return /즉석사진/.test(cat(p)); } },
      { keyword: '인생네컷', sub: 'photo', match: function (p) { return /즉석사진/.test(cat(p)); } },
      { keyword: '코인노래방', sub: 'coinsing', match: function (p) { return /노래방/.test(cat(p)); } },
      { keyword: 'PC방', sub: 'pc', match: function (p) { return /PC방/.test(cat(p)); } },
      { keyword: '만화카페', sub: 'comic', match: function (p) { return /만화|보드카페/.test(cat(p)); } }
    ];
    // 각 검색에서 나올 수 있는 세부 분류 중 가장 짧은 머무는 시간 → 이걸로 검색 반경을 정해요
    SOURCES.forEach(function (src) {
      var ids = src.sub ? [src.sub] : ['cafe', 'bakery', 'fastfood', 'snack', 'meal', 'comic'];
      src.minStay = Math.min.apply(null, ids.map(function (id) { return SUBS[id].stay; }));
    });

    var waitView = stopPanel.querySelector('.wait-view');
    var waitBusEl = waitView.querySelector('.wait-bus');
    var waitBig = waitView.querySelector('.wait-clock .big');
    var waitSec = waitView.querySelector('.wait-clock .sec');
    var waitClockLabel = waitView.querySelector('.wait-clock .label');
    var waitFree = waitView.querySelector('.wait-free');
    var waitSlider = waitView.querySelector('.wait-manual input');
    var waitLiveButton = waitView.querySelector('.wait-live');
    var waitFilters = waitView.querySelector('.wait-filters');
    var waitCount = waitView.querySelector('.wait-count');
    var waitList = waitView.querySelector('.wait-list');

    var waitState = null;   // { stop, bus, endAt(버스 도착 시각), manual, places, fetchedFor, filter }
    var waitTimer = null;
    var waitMarkers = [];

    waitView.querySelector('.wait-back').addEventListener('click', function () { exitWait(); });
    waitSlider.addEventListener('input', function () {
      if (!waitState) return;
      waitState.manual = true;
      waitState.endAt = Date.now() + (Number(waitSlider.value) + BUFFER_MIN) * 60000; // "나 N분 있어" → 다녀올 시간이 N분
      waitLiveButton.hidden = !waitState.liveEndAt;
      tickWait(true);
    });
    waitLiveButton.addEventListener('click', function () {
      if (!waitState || !waitState.liveEndAt) return;
      waitState.manual = false;
      waitState.endAt = waitState.liveEndAt;
      waitLiveButton.hidden = true;
      tickWait(true);
    });

    // 분류 버튼: 큰 분류 줄 + (큰 분류를 고르면) 세부 분류 줄
    var waitSubFilters = waitView.querySelector('.wait-subfilters');
    function makeFilterButton(label, color, onClick) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (color) b.style.setProperty('--tag', color); // 고르면 그 분류 색으로
      b.addEventListener('click', onClick);
      return b;
    }
    function setOn(container, button) {
      container.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === button); });
    }
    function buildGroupFilters() {
      waitFilters.innerHTML = '';
      var all = makeFilterButton('전체', null, function () { pickGroup('all', all); });
      all.classList.add('on');
      waitFilters.appendChild(all);
      GROUPS.forEach(function (g) {
        var b = makeFilterButton(g.label, g.color, function () { pickGroup(g.id, b); });
        waitFilters.appendChild(b);
      });
      waitSubFilters.hidden = true;
    }
    function pickGroup(groupId, button) {
      if (!waitState) return;
      waitState.group = groupId;
      waitState.sub = 'all';
      setOn(waitFilters, button);
      waitSubFilters.innerHTML = '';
      var group = GROUPS.filter(function (g) { return g.id === groupId; })[0];
      waitSubFilters.hidden = !group;
      if (group) {
        var all = makeFilterButton('전체 ' + group.label, group.color, function () { pickSub('all', all); });
        all.classList.add('on');
        waitSubFilters.appendChild(all);
        group.subs.forEach(function (sub) {
          var b = makeFilterButton(sub.label, group.color, function () { pickSub(sub.id, b); });
          waitSubFilters.appendChild(b);
        });
      }
      renderWaitList();
    }
    function pickSub(subId, button) {
      if (!waitState) return;
      waitState.sub = subId;
      setOn(waitSubFilters, button);
      renderWaitList();
    }

    function enterWait(stop, bus) {
      if (!stop) return;
      var arr = bus.arr1 || {};
      var liveEndAt = arrivalTime(arr);
      waitState = {
        stop: stop, bus: bus, liveEndAt: liveEndAt, manual: !liveEndAt,
        endAt: liveEndAt || Date.now() + (Number(waitSlider.value) + BUFFER_MIN) * 60000,
        places: [], fetchedFor: 0, group: 'all', sub: 'all', lastMinute: null
      };
      buildGroupFilters();
      waitLiveButton.hidden = true;

      // 버스 표시
      waitBusEl.innerHTML = '';
      var type = /^N/.test(bus.route) ? { name: '심야', color: '#1f2a44' } : ROUTE_TYPES[bus.type] || { name: '', color: '#8a8a8a' };
      var chip = document.createElement('div');
      chip.className = 'route-chip';
      chip.style.background = type.color;
      if (type.text) chip.style.color = type.text;
      chip.textContent = bus.route;
      waitBusEl.appendChild(chip);
      var dir = document.createElement('span');
      dir.textContent = (type.name ? type.name + ' · ' : '') + bus.direction + '행';
      waitBusEl.appendChild(dir);

      var waitDest = waitView.querySelector('.wait-dest');
      var trip = destination && tripOf(bus);
      waitDest.hidden = !(trip && trip.ok);
      if (trip && trip.ok) waitDest.textContent = '🏁 ' + destination.label + ' ' + tripText(trip);

      stopPanel.classList.add('waiting');
      waitView.hidden = false;
      waitView.scrollTop = 0;
      tickWait(true);
      clearInterval(waitTimer);
      waitTimer = setInterval(function () { tickWait(false); }, 1000);
    }

    function exitWait() {
      if (!waitState) return;
      waitState = null;
      clearInterval(waitTimer);
      stopPanel.classList.remove('waiting');
      waitView.hidden = true;
      clearWaitMarkers();
      clearWalkPath();
      infowindow.close();
    }

    // 도착 정보 → 도착 시각 (지금 오고 있지 않으면 null)
    function arrivalTime(arr) {
      if (arr.status === 'running') return Date.now() + (arr.minutes * 60 + (arr.seconds || 0)) * 1000;
      if (arr.status === 'soon') return Date.now() + 60000;
      return null;
    }

    // 30초마다 도착 정보가 새로 오면 기다리는 버스의 도착 시각도 고쳐요
    function updateWaitFromBuses(buses) {
      var b = waitState.bus;
      var same = buses.filter(function (x) { return x.route === b.route && x.direction === b.direction; })[0];
      if (!same) return;
      waitState.bus = same;
      waitState.liveEndAt = arrivalTime(same.arr1 || {});
      if (!waitState.manual && waitState.liveEndAt) waitState.endAt = waitState.liveEndAt;
      if (waitState.manual && waitState.liveEndAt) waitLiveButton.hidden = false;
      tickWait(true);
    }

    // 1초마다: 시계를 바꾸고, 분이 바뀌면 목록도 다시 계산
    function tickWait(force) {
      if (!waitState) return;
      var leftSec = Math.max(0, Math.round((waitState.endAt - Date.now()) / 1000));
      var freeMin = Math.floor(leftSec / 60) - BUFFER_MIN; // 다녀올 수 있는 시간 (분)

      if (!waitState.manual) {
        waitClockLabel.textContent = '버스 오기까지';
        waitBig.textContent = Math.floor(leftSec / 60) + '분';
        waitSec.textContent = (leftSec % 60) + '초';
      } else {
        waitClockLabel.textContent = waitState.liveEndAt ? '직접 정한 시간' : '도착 정보가 없어서 직접 정한 시간';
        waitBig.textContent = Math.floor(leftSec / 60) + '분';
        waitSec.textContent = (leftSec % 60) + '초';
      }

      waitFree.classList.toggle('urgent', freeMin < 3);
      if (freeMin <= 0) {
        waitFree.innerHTML = '<b>지금은 정류장에서 기다려 주세요</b> <small>· 버스가 곧 와요</small>';
      } else {
        waitFree.innerHTML = '다녀올 수 있는 시간 <b>' + freeMin + '분</b> <small>· 복귀 여유 ' + BUFFER_MIN + '분</small>';
      }

      if (!force && freeMin === waitState.lastMinute) return;
      waitState.lastMinute = freeMin;
      if (!waitState.manual) waitSlider.value = Math.min(60, Math.max(3, freeMin));

      // 처음이거나 시간이 늘어나서 더 멀리 찾아야 하면 다시 검색, 아니면 있는 결과에서 거르기만
      if (freeMin > waitState.fetchedFor) fetchWaitPlaces(freeMin);
      else renderWaitList();
    }

    // 정류장 주변에서 업종별로 찾기. 업종마다 머무는 시간이 달라서 갈 수 있는 거리도 달라요
    function fetchWaitPlaces(freeMin) {
      var state = waitState;
      state.fetchedFor = freeMin;
      waitCount.textContent = '다녀올 수 있는 곳을 찾는 중…';
      var jobs = SOURCES.map(function (src) {
        var radius = maxOneWayMeters(freeMin, src.minStay);
        if (radius < 30) return Promise.resolve([]);
        var query = src.category ? { category: src.category } : src.keyword;
        return new Promise(function (resolve) {
          fetchAllPages(query, { location: state.stop.position, radius: radius, sort: kakao.maps.services.SortBy.DISTANCE }, function (list) {
            resolve(list.map(function (p) {
              var subId = src.classify ? src.classify(p) : (!src.match || src.match(p) ? src.sub : null);
              return subId ? { place: p, sub: SUBS[subId] } : null;
            }).filter(Boolean));
          });
        });
      });
      Promise.all(jobs).then(function (lists) {
        if (waitState !== state) return; // 그 사이 다른 버스를 골랐으면 버려요
        var byId = {}; // 여러 검색에 같은 가게가 나오면 하나만 (먼저 찾은 분류로)
        [].concat.apply([], lists).forEach(function (x) { if (!byId[x.place.id]) byId[x.place.id] = x; });
        state.places = Object.keys(byId).map(function (id) { return byId[id]; });
        renderWaitList();
      });
    }

    // 남은 시간 안에 왕복할 수 있는 가장 먼 거리 (미터, 직선거리 기준)
    function maxOneWayMeters(freeMin, stay) {
      var walkMin = (freeMin - stay) / 2;
      return Math.min(MAX_RADIUS, Math.floor(walkMin * WALK_M_PER_MIN / DETOUR));
    }

    function walkMinutesFromStop(place) {
      return Math.max(1, Math.ceil(Number(place.distance) * DETOUR / WALK_M_PER_MIN));
    }

    function renderWaitList() {
      if (!waitState) return;
      var leftSec = (waitState.endAt - Date.now()) / 1000;
      var freeMin = Math.floor(leftSec / 60) - BUFFER_MIN;
      var group = waitState.group;
      var subId = waitState.sub;

      var doable = waitState.places.map(function (x) {
        var walk = walkMinutesFromStop(x.place);
        return { place: x.place, sub: x.sub, walk: walk, stay: x.sub.stay, total: walk * 2 + x.sub.stay };
      }).filter(function (x) {
        return x.total <= freeMin &&
          (group === 'all' || x.sub.group.id === group) &&
          (subId === 'all' || x.sub.id === subId);
      });
      doable.sort(function (a, b) { return a.total - b.total || Number(a.place.distance) - Number(b.place.distance); });

      waitCount.innerHTML = '지금 다녀올 수 있는 곳 <b>' + doable.length + '곳</b>' +
        (doable.length ? ' · 빨리 다녀올 수 있는 순' : '');
      waitList.innerHTML = '';
      clearWaitMarkers();

      if (doable.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'wait-empty';
        empty.textContent = freeMin <= 0
          ? '버스가 곧 와요. 정류장에서 기다려 주세요.'
          : '이 시간 안에 다녀올 만한 곳이 없어요. 다른 분류를 보거나 시간을 늘려 보세요.';
        waitList.appendChild(empty);
        return;
      }

      doable.forEach(function (x) {
        var p = x.place;
        // 한 줄:  [카페] 메가MGC커피 석계역점        여유 5분
        //         총 7분 · 걸어서 1분
        var item = document.createElement('div');
        item.className = 'wait-item';
        var head = document.createElement('div');
        head.className = 'w-head';
        var tag = document.createElement('span');
        tag.className = 'w-tag';
        tag.style.background = x.sub.group.color; // 색은 큰 분류, 글자는 세부 분류
        tag.textContent = x.sub.label;
        head.appendChild(tag);
        addLine(head, 'w-name', p.place_name);
        item.appendChild(head);
        var spare = freeMin - x.total;
        addLine(item, 'w-spare' + (spare <= 1 ? ' tight' : ''), spare === 0 ? '딱 맞아요' : '여유 ' + spare + '분');
        addLine(item, 'w-plan', '총 ' + x.total + '분 · 걸어서 ' + x.walk + '분');
        item.title = '가는 ' + x.walk + '분 + 머무는 ' + x.stay + '분' + (x.sub.note ? '(' + x.sub.note + ')' : '') + ' + 오는 ' + x.walk + '분'; // 자세한 계산은 마우스를 올리면
        item.addEventListener('click', function () { focusWaitPlace(p); });
        waitList.appendChild(item);

        var marker = new kakao.maps.Marker({
          map: map, position: new kakao.maps.LatLng(p.y, p.x), title: p.place_name,
          image: pinImage(x.sub.group.color) // 목록 태그와 같은 큰 분류 색
        });
        var focus = function () { focusWaitPlace(p); };
        kakao.maps.event.addListener(marker, 'click', focus);
        waitMarkers.push({ marker: marker, focus: focus }); // 휴대폰에서 지도 클릭과 겹쳐도 찾을 수 있게 검색 마커와 같은 모양으로
      });
    }

    // 목록이나 마커를 누르면: 가게 카드 + 정류장에서 가는 길 / 정류장으로 돌아오는 길
    function focusWaitPlace(place) {
      var card = buildPlaceCard(place);
      card.querySelectorAll('.buttons a').forEach(function (a) { // 일반 길찾기는 아래 도보 길과 겹쳐서 빼요
        if (a.textContent === '길찾기') a.remove();
      });
      var stop = waitState.stop;
      var stopPoint = encodeURIComponent(stop.name) + ',' + stop.position.getLat() + ',' + stop.position.getLng();
      var placePoint = encodeURIComponent(place.place_name) + ',' + place.y + ',' + place.x;
      var buttons = document.createElement('div');
      buttons.className = 'buttons';
      addLink(buttons, '가는 길 (도보)', 'https://map.kakao.com/link/by/walk/' + stopPoint + '/' + placePoint);
      addLink(buttons, '돌아오는 길', 'https://map.kakao.com/link/by/walk/' + placePoint + '/' + stopPoint);
      card.appendChild(buttons);

      // TMAP 보행자 경로로 실제 도보 시간을 받아서, 지도에 길을 그리고 "다녀올 수 있는지"를 다시 계산해요
      var real = document.createElement('div');
      real.className = 'walk-real';
      real.textContent = '🚶 실제 걷는 길 확인 중…';
      card.insertBefore(real, buttons);
      openInfoAt(card, new kakao.maps.LatLng(place.y, place.x));

      var entry = waitState.places.filter(function (x) { return x.place === place; })[0];
      var stay = entry ? entry.sub.stay : 5;
      var state = waitState;
      fetchWalk(stop.position, new kakao.maps.LatLng(place.y, place.x)).then(function (walk) {
        if (waitState !== state) return;
        if (!walk) { real.textContent = '🚶 실제 걷는 길을 가져오지 못했어요 (어림값으로 계산했어요)'; return; }
        drawWalkPath(walk.path);
        var oneWay = Math.max(1, Math.ceil(walk.seconds / 60));
        var total = oneWay * 2 + stay;
        var freeMin = Math.floor((waitState.endAt - Date.now()) / 60000) - BUFFER_MIN;
        var spare = freeMin - total;
        real.textContent = '🚶 실제 길 ' + walk.distance + 'm · 가는 ' + oneWay + '분 + 머무는 ' + stay + '분 + 오는 ' + oneWay + '분 = ' + total + '분 · ' +
          (spare >= 0 ? '여유 ' + spare + '분' : '⚠️ ' + (-spare) + '분 모자라요');
        real.classList.toggle('short', spare < 0);
        infowindow.setContent(card); // 말풍선 크기 다시 맞추기
      });
    }

    // 정류장 ↔ 가게 도보 경로 (TMAP, 하루 1,000건). 같은 구간은 다시 부르지 않아요
    var walkCache = {};
    var walkLine = null;
    function fetchWalk(from, to) {
      var key = [from.getLng(), from.getLat(), to.getLng(), to.getLat()].map(function (v) { return v.toFixed(5); }).join(',');
      if (!walkCache[key]) {
        walkCache[key] = fetch('/api/tmap?type=walk&sx=' + from.getLng() + '&sy=' + from.getLat() + '&ex=' + to.getLng() + '&ey=' + to.getLat())
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { return d && d.seconds ? d : null; })
          .catch(function () { return null; });
        walkCache[key].then(function (d) { if (!d) delete walkCache[key]; }); // 실패한 건 다음에 다시
      }
      return walkCache[key];
    }

    function drawWalkPath(path) {
      clearWalkPath();
      if (!path || path.length < 2) return;
      walkLine = new kakao.maps.Polyline({
        map: map,
        path: path.map(function (c) { return new kakao.maps.LatLng(c[1], c[0]); }),
        strokeWeight: 5, strokeColor: '#7C3AED', strokeOpacity: 0.85, strokeStyle: 'solid'
      });
    }

    function clearWalkPath() {
      if (walkLine) { walkLine.setMap(null); walkLine = null; }
    }

    // 카테고리 색 핀 그림 (색마다 한 번만 만들어서 다시 써요)
    var pinImages = {};
    function pinImage(color) {
      if (pinImages[color]) return pinImages[color];
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="36" viewBox="0 0 26 36">' +
        '<path d="M13 1C6.4 1 1 6.3 1 12.9 1 21.8 13 35 13 35s12-13.2 12-22.1C25 6.3 19.6 1 13 1z" fill="' + color + '" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="13" cy="13" r="4.5" fill="#fff"/></svg>';
      pinImages[color] = new kakao.maps.MarkerImage(
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        new kakao.maps.Size(26, 36),
        { offset: new kakao.maps.Point(13, 35) } // 핀 끝이 가게 위치에 오게
      );
      return pinImages[color];
    }

    function clearWaitMarkers() {
      waitMarkers.forEach(function (m) { m.marker.setMap(null); });
      waitMarkers = [];
    }

    // 클릭한 자리가 가게 마커 그림 위인지 확인 (화면 픽셀 거리로 비교)
    function findMarkerAt(latlng) {
      var projection = map.getProjection();
      var click = projection.containerPointFromCoords(latlng);
      var candidates = markers.concat(waitMarkers); // 검색 마커 + 기다리는 동안 다녀올 곳 마커
      for (var i = 0; i < candidates.length; i++) {
        if (!candidates[i].marker.getMap()) continue; // 동그라미 안에 묶여서 안 보이는 마커는 빼요
        var point = projection.containerPointFromCoords(candidates[i].marker.getPosition());
        var dx = click.x - point.x;
        var dy = click.y - point.y; // 마커 그림은 좌표보다 위쪽에 그려져요
        if (Math.abs(dx) <= 16 && dy >= -40 && dy <= 6) return candidates[i];
      }
      return null;
    }

    // ───────── 첫 화면: 출발지 → 목적지 버스 길찾기 ─────────
    // 출발지 400m 안의 정류장들을 모두 확인해서, 목적지까지 한 번에 가는 버스를 "빨리 도착하는 순"으로 추천해요.
    // 도착 예상 = 정류장까지 걷기(또는 버스 기다리기 중 긴 쪽) + 정거장 수 × 2분 + 내려서 걷기
    var TRIP_STOP_RADIUS = 400;   // 출발지에서 이만큼 안의 정류장까지 확인 (미터)
    var TRIP_MAX_STOPS = 8;       // 가까운 정류장 몇 곳까지 확인할지 (API 사용량 때문에)
    var tripFrom = document.getElementById('trip-from');
    var tripTo = document.getElementById('trip-to');
    var tripRequest = 0;
    var originFlag = null;

    // 탭: 버스 길찾기 / 장소 검색
    document.querySelectorAll('.mode-tabs button').forEach(function (tab) {
      tab.addEventListener('click', function () {
        var mode = tab.dataset.mode;
        document.querySelectorAll('.mode-tabs button').forEach(function (t) {
          t.classList.toggle('on', t === tab);
          t.setAttribute('aria-selected', String(t === tab));
        });
        document.getElementById('trip-form').hidden = mode !== 'trip';
        document.getElementById('search-form').hidden = mode !== 'place';
      });
    });

    document.getElementById('trip-me').addEventListener('click', function () {
      tripFrom.value = '';
      tripFrom.placeholder = '내 위치';
      locateMe(function () { tripFrom.placeholder = '내 위치 ✓'; }, function () {
        tripFrom.placeholder = '출발지 (위치 권한이 없어요)';
      });
    });

    document.getElementById('trip-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var toText = tripTo.value.trim();
      if (!toText) { tripTo.focus(); return; }
      tripFrom.blur(); tripTo.blur(); // 휴대폰 키보드 내리기
      var thisRequest = ++tripRequest;
      setActiveChip(null);
      clearMarkers();
      showTripMessage('출발지를 찾는 중…');

      resolveOrigin(tripFrom.value.trim(), function (origin) {
        if (thisRequest !== tripRequest) return;
        if (!origin) return showTripMessage('출발지 "' + tripFrom.value.trim() + '"을(를) 찾지 못했어요.');
        if (origin.locationError) return showLocationProblem(origin.locationError);
        places.keywordSearch(toText, function (data, status) {
          if (thisRequest !== tripRequest) return;
          if (status !== kakao.maps.services.Status.OK) return showTripMessage('목적지 "' + toText + '"을(를) 찾지 못했어요.');
          var top = data[0];
          var dest = { label: toText, name: top.place_name, address: top.road_address_name || top.address_name, position: new kakao.maps.LatLng(top.y, top.x) };
          planTrip(origin, dest, thisRequest);
        }, { location: origin.position }); // 같은 이름이 여러 곳이면 출발지에서 가까운 곳
      });
    });

    // 출발지: 비어 있으면 내 위치(안 되면 지금 보는 지도 가운데), 글자가 있으면 그 장소
    function resolveOrigin(text, done) {
      if (!text) {
        if (myPosition) return done({ label: '내 위치', name: '내 위치', position: myPosition });
        showTripMessage('📍 내 위치를 찾는 중… (위치 권한을 물어보면 "허용"을 눌러 주세요)');
        tripFrom.placeholder = '내 위치 찾는 중…';
        locateMe(function (here) {
          tripFrom.placeholder = '내 위치 ✓';
          done({ label: '내 위치', name: '내 위치', position: here });
        }, function (err) {
          tripFrom.placeholder = '출발지 (비우면 내 위치)';
          done({ locationError: err }); // 조용히 다른 곳에서 출발하지 않고, 이유를 알려줘요
        });
        return;
      }
      places.keywordSearch(text, function (data, status) {
        if (status !== kakao.maps.services.Status.OK) return done(null);
        done({ label: text, name: data[0].place_name, position: new kakao.maps.LatLng(data[0].y, data[0].x) });
      }, { location: myPosition || map.getCenter() });
    }

    function planTrip(origin, dest, thisRequest) {
      lastTrip = { origin: origin, dest: dest };
      clearRoute();
      // 지도: 출발 깃발 + 목적지 깃발, 출발지 쪽으로 이동 (정류장도 그 주변으로 다시 불러와요)
      if (originFlag) originFlag.setMap(null);
      var flag = document.createElement('div');
      flag.className = 'route-flag';
      flag.style.background = '#30a46c';
      flag.textContent = '출발 · ' + origin.label;
      originFlag = new kakao.maps.CustomOverlay({ position: origin.position, content: flag, yAnchor: 1.4, zIndex: 4 });
      originFlag.setMap(map);
      setDestination(dest);
      destInput.value = dest.label;
      map.setLevel(4);
      map.setCenter(origin.position);

      showTripMessage(origin.label + ' 근처 정류장에서 ' + dest.label + '까지 가는 버스를 찾는 중…');

      fetch('/api/bus?type=nearby&lat=' + origin.position.getLat() + '&lng=' + origin.position.getLng() + '&radius=' + TRIP_STOP_RADIUS)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (thisRequest !== tripRequest) return;
          var stops = (data.stations || []).slice(0, TRIP_MAX_STOPS); // 가까운 순으로 와요
          return Promise.all(stops.map(function (stop) { return optionsAtStop(stop, dest); }))
            .then(function (lists) {
              if (thisRequest !== tripRequest) return;
              renderTripOptions(origin, dest, [].concat.apply([], lists));
            });
        })
        .catch(function () {
          if (thisRequest === tripRequest) showTripMessage('버스 정보를 가져오지 못했어요. 잠시 후 다시 해 보세요.');
        });
    }

    // 정류장 하나: 도착 정보 + 노선 목록으로 목적지 가는 버스 찾기
    function optionsAtStop(stop, dest) {
      stop.position = new kakao.maps.LatLng(stop.lat, stop.lng);
      var walkTo = Math.max(1, Math.ceil(stop.dist * DETOUR / WALK_M_PER_MIN));
      return fetch('/api/bus?type=arrivals&id=' + stop.id + '&arsId=' + stop.arsId + '&seoul=' + (stop.seoul ? 1 : 0) + '&gg=' + (stop.gg ? 1 : 0))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var buses = (data.buses || []).filter(function (b) { return b.routeId; });
          return Promise.all(buses.map(function (bus) {
            return routeStations(bus.routeId).then(function (stations) {
              var trip = findAlight(stations, bus.order, dest.position);
              if (!trip.ok || trip.stops > MAX_STOPS) return null;
              trips[tripKey(bus)] = trip; // 정류장 패널에서도 다시 계산하지 않게
              return makeOption(stop, bus, trip, walkTo);
            });
          }));
        })
        .then(function (list) { return list.filter(Boolean); })
        .catch(function () { return []; });
    }

    // 걸어가서 탈 수 있는 버스 고르기: 첫 버스가 걷는 시간보다 먼저 오면 두 번째 버스
    function makeOption(stop, bus, trip, walkTo) {
      var waits = [bus.arr1, bus.arr2].map(arrivalMinutes);
      var wait = null;
      for (var i = 0; i < waits.length; i++) {
        if (waits[i] !== null && waits[i] >= walkTo) { wait = waits[i]; break; }
      }
      var ride = trip.stops * MIN_PER_STOP;
      return {
        stop: stop, bus: bus, trip: trip, walkTo: walkTo, wait: wait,
        total: wait === null ? null : Math.max(walkTo, wait) + ride + trip.walk
      };
    }

    function arrivalMinutes(arr) {
      if (!arr) return null;
      if (arr.status === 'running') return arr.minutes + (arr.seconds || 0) / 60;
      if (arr.status === 'soon') return 0.5;
      return null; // 출발 대기, 운행 종료, 정보 없음
    }

    function renderTripOptions(origin, dest, options) {
      // 같은 노선은 가장 빨리 도착하는 정류장 하나만
      var best = {};
      options.forEach(function (o) {
        var key = o.bus.routeId;
        var cur = best[key];
        var score = o.total === null ? Infinity : o.total;
        if (!cur || score < (cur.total === null ? Infinity : cur.total) ||
            (score === Infinity && o.walkTo < cur.walkTo)) best[key] = o;
      });
      var list = Object.keys(best).map(function (k) { return best[k]; });
      list.sort(function (a, b) {
        var ta = a.total === null ? Infinity : a.total;
        var tb = b.total === null ? Infinity : b.total;
        return ta - tb || a.walkTo - b.walkTo;
      });
      var catchable = list.filter(function (o) { return o.total !== null; });

      resultList.innerHTML = '';

      // 맨 위 요약: 출발 → 도착, 상태 한 줄, [환승 경로 찾기] + 카카오맵 링크
      var summary = document.createElement('li');
      summary.className = 'trip-summary';
      var title = document.createElement('div');
      title.className = 'ts-title';
      title.innerHTML = '<span class="trip-dot from"></span><b></b><span class="ts-arrow">→</span><span class="trip-dot to"></span><b></b>';
      title.querySelectorAll('b')[0].textContent = origin.label;
      title.querySelectorAll('b')[1].textContent = dest.label;
      summary.appendChild(title);
      var straight = distanceMeters(origin.position, dest.position);
      addLine(summary, 'ts-sub', list.length === 0
        ? '근처 ' + TRIP_STOP_RADIUS + 'm 안 정류장에서 한 번에 가는 버스가 없어요. 환승 경로를 찾아보세요.'
        : '한 번에 가는 버스 ' + list.length + '개' + (straight < 800 ? ' · 🚶 걸어서 약 ' + Math.ceil(straight * DETOUR / WALK_M_PER_MIN) + '분 거리' : ''));
      var actions = document.createElement('div');
      actions.className = 'ts-actions';
      var transitButton = document.createElement('button'); // TMAP 대중교통은 무료 하루 10건뿐이라 누를 때만
      transitButton.type = 'button';
      transitButton.className = 'transit-button' + (list.length === 0 ? ' big' : '');
      transitButton.textContent = '🔁 환승 경로 찾기';
      actions.appendChild(transitButton);
      var link = document.createElement('a');
      link.className = 'ts-kakao';
      link.href = kakaoRouteUrl('traffic', origin.name, origin.position, dest.name, dest.position);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '카카오맵에서 보기 ↗';
      actions.appendChild(link);
      summary.appendChild(actions);
      resultList.appendChild(summary);

      // 환승 경로가 들어갈 자리 (요약 바로 아래)
      var transitAnchor = document.createElement('li');
      transitAnchor.className = 'transit-anchor';
      transitAnchor.hidden = true;
      resultList.appendChild(transitAnchor);
      transitButton.addEventListener('click', function () {
        transitButton.disabled = true;
        transitButton.textContent = '환승 경로를 찾는 중…';
        showTransit(origin, dest, transitAnchor, function () { transitButton.remove(); });
      });

      if (list.length > 0) resultList.appendChild(sectionTitle('한 번에 가는 버스', '빨리 도착하는 순'));
      list.forEach(function (o) {
        var type = /^N/.test(o.bus.route) ? { name: '심야', color: '#1f2a44' } : ROUTE_TYPES[o.bus.type] || { name: '', color: '#8a8a8a' };
        var ride = o.trip.stops * MIN_PER_STOP;
        var card = buildRouteCard({
          minutes: o.total === null ? null : Math.round(o.total),
          sub: '환승 없음 · 도보 ' + (o.walkTo + o.trip.walk) + '분',
          legs: [
            { mode: 'WALK', minutes: o.walkTo },
            { mode: 'BUS', minutes: ride, label: o.bus.route, color: type.color, text: type.text, board: o.stop.name, alight: o.trip.station.name, stops: o.trip.stops },
            { mode: 'WALK', minutes: o.trip.walk }
          ],
          live: Promise.resolve(o.wait === null ? '도착 정보 없음' : o.wait < 1 ? '곧 도착' : Math.round(o.wait) + '분 후'),
          onSelect: function () { drawOptionRoute(o); },
          onWait: function () { openTripOption(o); }
        });
        if (o.total === null) card.classList.add('later');
        resultList.appendChild(card);
      });

      if (catchable.length > 0) showBusHint('경로를 누르면 지도에 길이 그려져요', 4000);
    }

    function sectionTitle(text, note) {
      var li = document.createElement('li');
      li.className = 'section-title';
      li.textContent = text;
      if (note) { var small = document.createElement('small'); small.textContent = note; li.appendChild(small); }
      return li;
    }

    // ───────── 경로 카드 (카카오맵·네이버지도 길찾기 결과처럼) ─────────
    //  70분                          오후 4:12 도착
    //  환승 2회 · 3,200원 · 도보 19분
    //  [🚶][■ 1167 ■][🚶][■■■ 7호선 ■■■][🚶]     ← 시간 비율 막대
    //  ● 1167   서울문화고등학교 승차      곧 도착
    //           5정거장 · 노원역5번출구 하차
    //  [이 버스 기다리며 다녀올 곳 ›]
    function buildRouteCard(spec) {
      var card = document.createElement('li');
      card.className = 'route-card';

      var top = document.createElement('div');
      top.className = 'rc-top';
      var min = document.createElement('span');
      min.className = 'rc-min';
      if (spec.minutes === null) {
        min.textContent = '도착 정보 없음';
      } else {
        var hours = Math.floor(spec.minutes / 60), mins = spec.minutes % 60;
        min.innerHTML = (hours ? '<b>' + hours + '</b>시간 ' : '') + '<b>' + mins + '</b>분';
      }
      top.appendChild(min);
      var eta = document.createElement('span');
      eta.className = 'rc-eta';
      top.appendChild(eta);
      card._setEta = function (minutesFromNow) { // 버스 기다리는 시간까지 넣어서 도착 시각을 다시 쓸 수 있게
        eta.textContent = minutesFromNow === null ? '' : clockText(Date.now() + minutesFromNow * 60000) + ' 도착';
      };
      card._setEta(spec.minutes);
      card.appendChild(top);
      addLine(card, 'rc-sub', spec.sub);

      // 시간 비율 막대
      var bar = document.createElement('div');
      bar.className = 'rc-bar';
      spec.legs.forEach(function (leg) {
        var seg = document.createElement('span');
        seg.style.flexGrow = Math.max(1, leg.minutes);
        if (leg.mode === 'WALK') {
          seg.className = 'seg walk';
          seg.title = '도보 ' + leg.minutes + '분';
        } else {
          seg.className = 'seg ride';
          seg.style.background = leg.color;
          if (leg.text) seg.style.color = leg.text;
          seg.textContent = leg.label;
          seg.title = leg.label + ' ' + leg.minutes + '분';
        }
        bar.appendChild(seg);
      });
      card.appendChild(bar);

      // 타는 곳 목록
      var steps = document.createElement('div');
      steps.className = 'rc-steps';
      var firstRide = true;
      spec.legs.forEach(function (leg) {
        if (leg.mode === 'WALK') return;
        var row = document.createElement('div');
        row.className = 'rc-step';
        var badge = document.createElement('span');
        badge.className = 'rc-badge';
        badge.style.background = leg.color;
        if (leg.text) badge.style.color = leg.text;
        badge.textContent = leg.label;
        row.appendChild(badge);
        var where = document.createElement('div');
        where.className = 'rc-where';
        addLine(where, 'rc-board', leg.board + ' 승차');
        addLine(where, 'rc-alight', (leg.stops ? leg.stops + '정거장 · ' : '') + leg.alight + ' 하차');
        row.appendChild(where);
        if (firstRide && spec.live) { // 첫 번째로 타는 것만 실시간 도착
          var live = document.createElement('span');
          live.className = 'rc-live';
          live.textContent = '…';
          row.appendChild(live);
          spec.live.then(function (text) {
            live.textContent = text;
            live.classList.toggle('soon', /곧|^[1-3]분/.test(text));
          });
        }
        firstRide = false;
        steps.appendChild(row);
      });
      card.appendChild(steps);

      // 기다리는 동안 다녀올 곳
      var actions = document.createElement('div');
      actions.className = 'rc-actions';
      var go = document.createElement('button');
      go.type = 'button';
      go.textContent = spec.onWait ? '이 버스 기다리며 다녀올 곳 ›' : '실시간 버스 확인 중…';
      go.disabled = !spec.onWait;
      go.addEventListener('click', function (e) {
        e.stopPropagation();
        if (card._onWait) card._onWait();
      });
      actions.appendChild(go);
      card.appendChild(actions);
      card._onWait = spec.onWait || null;
      card._waitButton = go;

      card.addEventListener('click', function () {
        resultList.querySelectorAll('.route-card.selected').forEach(function (e) { e.classList.remove('selected'); });
        card.classList.add('selected');
        spec.onSelect();
      });
      return card;
    }

    // 나중에 실시간 버스를 찾으면 "기다리며 다녀올 곳" 버튼을 켜요 (환승 경로)
    function enableCardWait(card, onWait, label) {
      card._onWait = onWait;
      card._waitButton.disabled = !onWait;
      card._waitButton.textContent = label;
    }

    function clockText(time) {
      var d = new Date(time);
      var h = d.getHours(), m = d.getMinutes();
      return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
    }

    // ───────── 지도에 경로 그리기 (카카오맵 길찾기처럼) ─────────
    //  걷기: 회색 선 · 버스: 버스 색 굵은 선 + 가운데 흰 점선 · "○○ 승차 / ○○ 하차" 이름표
    var lastTrip = null;          // 마지막 버스 길찾기의 { origin, dest }
    var routeShapes = [];         // 지도에 그린 선과 이름표 (지울 때 한꺼번에)
    var routeDraw = 0;            // 그리는 중에 다른 경로를 누르면 앞의 것은 버려요
    var routePathCache = {};

    var routeHidStops = false;    // 경로를 보는 동안 정류장 아이콘을 잠깐 껐는지

    function clearRoute() {
      routeDraw++;
      routeShapes.forEach(function (x) { x.setMap(null); });
      routeShapes = [];
      if (routeHidStops) { // 경로를 지우면 정류장 표시를 다시 켜요
        routeHidStops = false;
        if (!busOn) busToggle.click();
      }
    }

    // 정류장 아이콘이 많으면 경로를 가려서, 경로를 그릴 때는 잠깐 꺼요 (🚌 버튼으로 다시 켤 수 있어요)
    function hideStopsForRoute() {
      if (!busOn) return;
      busToggle.click();
      routeHidStops = true;
      showBusHint('경로가 잘 보이게 정류장 표시를 잠깐 껐어요 (🚌 버튼으로 다시 켜기)', 4000);
    }

    function toLatLngs(path) { return path.map(function (c) { return new kakao.maps.LatLng(c[1], c[0]); }); }

    function drawWalkSegment(latlngs) {
      routeShapes.push(new kakao.maps.Polyline({ map: map, path: latlngs, strokeWeight: 7, strokeColor: '#ffffff', strokeOpacity: 0.9 }));
      routeShapes.push(new kakao.maps.Polyline({ map: map, path: latlngs, strokeWeight: 4, strokeColor: '#7a7a7a', strokeOpacity: 0.95 }));
    }

    function drawRideSegment(latlngs, color) {
      routeShapes.push(new kakao.maps.Polyline({ map: map, path: latlngs, strokeWeight: 10, strokeColor: '#ffffff', strokeOpacity: 0.95 }));
      routeShapes.push(new kakao.maps.Polyline({ map: map, path: latlngs, strokeWeight: 7, strokeColor: color, strokeOpacity: 1 }));
      routeShapes.push(new kakao.maps.Polyline({ map: map, path: latlngs, strokeWeight: 2, strokeColor: '#ffffff', strokeOpacity: 0.9, strokeStyle: 'dash' }));
    }

    function addRouteLabel(position, name, action, color) {
      var el = document.createElement('div');
      el.className = 'route-label';
      var nameEl = document.createElement('span');
      nameEl.textContent = name;
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = color;
      tag.textContent = action; // "승차" / "하차" / "환승"
      el.appendChild(nameEl);
      el.appendChild(tag);
      routeShapes.push(new kakao.maps.CustomOverlay({ map: map, position: position, content: el, yAnchor: 1.5, zIndex: 6 }));
    }

    function fitRoute(points) {
      var bounds = new kakao.maps.LatLngBounds();
      points.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds, 60, 40, 60, 40); // 위·오른쪽·아래·왼쪽 여백 (픽셀)
    }

    // 노선 모양 전체에서 승차 정류장 ~ 하차 정류장 구간만 잘라내기
    function sliceRoutePath(path, from, to) {
      var nearest = function (target, startIdx) {
        var best = startIdx, bestD = Infinity;
        var cos = Math.cos(target.getLat() * Math.PI / 180);
        for (var i = startIdx; i < path.length; i++) {
          var dx = (path[i][0] - target.getLng()) * cos, dy = path[i][1] - target.getLat();
          var d = dx * dx + dy * dy;
          if (d < bestD) { bestD = d; best = i; }
        }
        return best;
      };
      var a = nearest(from, 0);
      var b = nearest(to, a); // 하차는 승차 뒤에서 찾아요 (같은 길을 돌아오는 노선이 있어서)
      return path.slice(a, b + 1);
    }

    function routePath(routeId) {
      if (!routePathCache[routeId]) {
        routePathCache[routeId] = fetch('/api/bus?type=routepath&routeId=' + routeId)
          .then(function (r) { return r.json(); })
          .then(function (d) { return d.path || []; })
          .catch(function () { delete routePathCache[routeId]; return []; });
      }
      return routePathCache[routeId];
    }

    // 한 번에 가는 버스 추천 → 출발 → (걷기) → 승차 → (버스) → 하차 → (걷기) → 도착
    function drawOptionRoute(o) {
      if (!lastTrip) return;
      clearRoute();
      var mine = routeDraw;
      var origin = lastTrip.origin.position, dest = lastTrip.dest.position;
      var board = o.stop.position;
      var alight = new kakao.maps.LatLng(o.trip.station.lat, o.trip.station.lng);
      var type = /^N/.test(o.bus.route) ? { color: '#1f2a44' } : ROUTE_TYPES[o.bus.type] || { color: '#8a8a8a' };
      hideStopsForRoute();
      fitRoute([origin, board, alight, dest]); // 먼저 전체가 보이게

      Promise.all([fetchWalk(origin, board), routePath(o.bus.routeId), fetchWalk(alight, dest)]).then(function (r) {
        if (mine !== routeDraw) return;
        drawWalkSegment(r[0] ? toLatLngs(r[0].path) : [origin, board]);
        var ride = r[1].length > 1 ? toLatLngs(sliceRoutePath(r[1], board, alight)) : [board, alight];
        drawRideSegment(ride.length > 1 ? ride : [board, alight], type.color);
        drawWalkSegment(r[2] ? toLatLngs(r[2].path) : [alight, dest]);
        addRouteLabel(board, o.stop.name, '승차', type.color);
        addRouteLabel(alight, o.trip.station.name, '하차', type.color);
      });
    }

    // TMAP 환승 경로 → 구간마다 모양이 들어 있어서 그대로 그려요
    function drawItinerary(it) {
      clearRoute();
      hideStopsForRoute();
      var points = [];
      it.legs.forEach(function (leg, i) {
        var latlngs = toLatLngs(leg.path || [[leg.start.lng, leg.start.lat], [leg.end.lng, leg.end.lat]]);
        points = points.concat(latlngs);
        if (leg.mode === 'WALK') { drawWalkSegment(latlngs); return; }
        var color = leg.routeColor ? '#' + leg.routeColor : '#8a8a8a';
        drawRideSegment(latlngs, color);
        var firstRide = it.legs.slice(0, i).every(function (l) { return l.mode === 'WALK'; });
        addRouteLabel(new kakao.maps.LatLng(leg.start.lat, leg.start.lng), leg.start.name, firstRide ? '승차' : '환승', color);
        addRouteLabel(new kakao.maps.LatLng(leg.end.lat, leg.end.lng), leg.end.name, '하차', color);
      });
      if (points.length) fitRoute(points);
    }

    // 추천 누르기 → 그 정류장 패널 + 그 버스 "기다리는 동안 다녀올 곳\"
    function openTripOption(o) {
      showStopCard(o.stop, o.stop.position);
      enterWait(o.stop, o.bus);
    }

    // ───────── 환승 경로 (TMAP 대중교통) ─────────
    // 첫 번째로 탈 버스를 우리 실시간 도착 정보와 맞춰서, 그 버스를 기다리는 동안 다녀올 곳으로 이어 줘요
    var transitCache = {};
    function fetchTransit(origin, dest) {
      // 출발·도착을 약 100m 단위로 맞춰서, 비슷한 구간은 저장해 둔 결과를 다시 써요 (서버에서도 하루 저장)
      var r = function (v) { return v.toFixed(3); };
      var q = 'sx=' + r(origin.position.getLng()) + '&sy=' + r(origin.position.getLat()) + '&ex=' + r(dest.position.getLng()) + '&ey=' + r(dest.position.getLat());
      if (!transitCache[q]) {
        transitCache[q] = fetch('/api/tmap?type=transit&v=2&' + q).then(function (res) { // v=2: 구간 모양이 들어간 새 형식
          return res.json().then(function (d) {
            if (res.status === 429 || d.error === 'quota') return { quota: true };
            if (d.error) throw new Error(d.error);
            return d;
          });
        });
        transitCache[q].catch(function () { delete transitCache[q]; });
      }
      return transitCache[q];
    }

    function showTransit(origin, dest, anchor, onDone) {
      fetchTransit(origin, dest).then(function (data) {
        onDone();
        anchor.hidden = false;
        if (data.quota) return showTransitNote(anchor, '오늘 환승 검색 횟수(무료 하루 10건)를 다 썼어요. "카카오맵에서 보기"로 확인해 주세요.');
        if (!data.itineraries.length) return showTransitNote(anchor, data.message || '대중교통 경로를 찾지 못했어요.');
        anchor.className = 'section-title';
        anchor.textContent = '환승 경로';
        var small = document.createElement('small');
        small.textContent = 'TMAP · 빨리 도착하는 순';
        anchor.appendChild(small);
        var after = anchor;
        data.itineraries.slice().sort(function (a, b) { return a.minutes - b.minutes; }).slice(0, 4).forEach(function (it) {
          var card = buildItineraryCard(it, dest);
          after.parentNode.insertBefore(card, after.nextSibling);
          after = card;
        });
      }).catch(function () {
        onDone();
        anchor.hidden = false;
        showTransitNote(anchor, '환승 경로를 가져오지 못했어요. 잠시 후 다시 해 보세요.');
      });
    }

    function showTransitNote(anchor, text) {
      anchor.className = 'message';
      anchor.textContent = text;
    }

    // "수도권7호선" → "7호선", "마을:노원09" → "노원09"
    function legLabel(leg) {
      return leg.route.split(':').pop().replace(/^수도권/, '').trim() || leg.mode;
    }

    // 밝은 색 바탕이면 글자를 진하게 (노란 마을버스, 한강버스 등)
    function textOn(hex) {
      var c = hex.replace('#', '');
      if (c.length !== 6) return null;
      var r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 170 ? '#1f1f1f' : null;
    }

    // TMAP 환승 경로 → 경로 카드
    function buildItineraryCard(it, dest) {
      var legs = it.legs.map(function (leg) {
        if (leg.mode === 'WALK') return { mode: 'WALK', minutes: leg.minutes };
        var color = leg.routeColor ? '#' + leg.routeColor : '#8a8a8a';
        return { mode: leg.mode, minutes: leg.minutes, label: legLabel(leg), color: color, text: textOn(color), board: leg.start.name, alight: leg.end.name, stops: leg.stops };
      });
      var first = it.legs.filter(function (l) { return l.mode !== 'WALK'; })[0];
      var match = first && first.mode === 'BUS' ? findLiveBus(first) : Promise.resolve(null);
      var card = buildRouteCard({
        minutes: it.minutes,
        sub: (it.transfers ? '환승 ' + it.transfers + '회' : '환승 없음') + (it.fare ? ' · ' + it.fare.toLocaleString() + '원' : '') + ' · 도보 ' + it.walkMinutes + '분',
        legs: legs,
        live: match.then(function (m) {
          if (!first || first.mode !== 'BUS') return '';
          if (!m) return '실시간 정보 없음';
          var arr = formatArrival(m.bus.arr1);
          return arr.wait ? arr.main : arr.main === '곧 도착' ? '곧 도착' : arr.main + ' 후';
        }),
        onSelect: function () { drawItinerary(it); },
        onWait: null
      });
      match.then(function (m) {
        if (!m) { enableCardWait(card, null, first && first.mode === 'BUS' ? '실시간 버스 정보를 찾지 못했어요' : '첫 구간이 버스가 아니에요'); return; }
        var arr = formatArrival(m.bus.arr1);
        if (arr.wait) { enableCardWait(card, null, m.bus.route + ' · 지금은 ' + arr.main); return; } // 운행 종료·출발 대기
        // 도착 시각 = 정류장까지 걷기와 버스 기다리기 중 긴 쪽 + 나머지 이동 시간
        var firstWalk = it.legs[0].mode === 'WALK' ? it.legs[0].minutes : 0;
        var waitMin = arr.order / 60;
        card._setEta(Math.round(Math.max(firstWalk, waitMin) + it.minutes - firstWalk));
        enableCardWait(card, function () {
          showStopCard(m.stop, m.stop.position);
          enterWait(m.stop, m.bus);
          var note = waitView.querySelector('.wait-dest');
          note.hidden = false;
          note.textContent = '🏁 ' + dest.label + ' · 환승 경로 약 ' + it.minutes + '분 (환승 ' + it.transfers + '회)';
        }, m.bus.route + ' 기다리며 다녀올 곳 ›');
      });
      return card;
    }

    // TMAP의 탑승 정류장(좌표)과 노선 이름으로 우리 정류장·실시간 버스 찾기 (정류장 번호 체계가 달라서 위치로 맞춰요)
    function findLiveBus(leg) {
      var name = leg.route.split(':').pop().trim(); // "마을:노원09" → "노원09"
      var sameRoute = function (b) { return b.route === name || b.route.replace(/[가-힣]+$/, '') === name; };
      return fetch('/api/bus?type=nearby&lat=' + leg.start.lat + '&lng=' + leg.start.lng + '&radius=120')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var stops = (data.stations || []).slice(0, 3);
          return Promise.all(stops.map(function (stop) {
            stop.position = new kakao.maps.LatLng(stop.lat, stop.lng);
            return fetch('/api/bus?type=arrivals&id=' + stop.id + '&arsId=' + stop.arsId + '&seoul=' + (stop.seoul ? 1 : 0) + '&gg=' + (stop.gg ? 1 : 0))
              .then(function (r) { return r.json(); })
              .then(function (d) {
                return (d.buses || []).filter(sameRoute).map(function (bus) { return { stop: stop, bus: bus }; });
              })
              .catch(function () { return []; });
          }));
        })
        .then(function (lists) {
          var all = [].concat.apply([], lists);
          all.sort(function (a, b) { return formatArrival(a.bus.arr1).order - formatArrival(b.bus.arr1).order; });
          return all[0] || null;
        })
        .catch(function () { return null; });
    }

    // 내 위치를 못 찾았을 때: 이유 + "다시 시도" / "지도 가운데에서 출발" / 출발지 직접 입력 안내
    function showLocationProblem(err) {
      showTripMessage('');
      var li = resultList.querySelector('li');
      li.className = 'message location-problem';
      addLine(li, 'lp-title', '📍 내 위치를 찾지 못했어요');
      addLine(li, 'lp-text', locationErrorText(err));
      addLine(li, 'lp-text', '출발지 칸에 "석계역"처럼 장소 이름을 직접 써도 돼요.');
      var buttons = document.createElement('div');
      buttons.className = 'lp-buttons';
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = '다시 시도';
      retry.addEventListener('click', function () { document.querySelector('.trip-go').click(); });
      var center = document.createElement('button');
      center.type = 'button';
      center.textContent = '지도 가운데에서 출발';
      center.addEventListener('click', function () {
        var thisRequest = ++tripRequest;
        var toText = tripTo.value.trim();
        var origin = { label: '지도 가운데', name: '지도 가운데', position: map.getCenter() };
        places.keywordSearch(toText, function (data, status) {
          if (thisRequest !== tripRequest) return;
          if (status !== kakao.maps.services.Status.OK) return showTripMessage('목적지 "' + toText + '"을(를) 찾지 못했어요.');
          var top = data[0];
          planTrip(origin, { label: toText, name: top.place_name, address: top.road_address_name || top.address_name, position: new kakao.maps.LatLng(top.y, top.x) }, thisRequest);
        }, { location: origin.position });
      });
      buttons.appendChild(retry);
      buttons.appendChild(center);
      li.appendChild(buttons);
    }

    function showTripMessage(text) {
      resultList.innerHTML = '';
      var li = document.createElement('li');
      li.className = 'message';
      li.textContent = text;
      resultList.appendChild(li);
    }

    // 버스정류장은 timezip의 핵심이라 처음부터 켜 둬요
    busToggle.click();
  </script>
</body>
</html>
